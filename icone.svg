
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512">

  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061944"/>
      <stop offset="55%" stop-color="#03091e"/>
      <stop offset="100%" stop-color="#18002f"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="45%" stop-color="#087bff"/>
      <stop offset="75%" stop-color="#8625ff"/>
      <stop offset="100%" stop-color="#ff25f5"/>
    </linearGradient>

    <linearGradient id="pontos" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00faff"/>
      <stop offset="55%" stop-color="#466aff"/>
      <stop offset="100%" stop-color="#df16ff"/>
    </linearGradient>

    <filter id="brilho" x="-50%" y="-50%"
            width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo do aplicativo -->
  <rect width="512" height="512" rx="100"
        fill="url(#fundo)"/>

  <!-- Contorno externo luminoso -->
  <rect x="29" y="29" width="454" height="454" rx="83"
        fill="none" stroke="url(#neon)"
        stroke-width="3" opacity=".85"
        filter="url(#brilho)"/>

  <!-- Balão de conversa -->
  <path d="M 164 346
           C 123 320, 105 279, 105 235
           C 105 151, 170 98, 257 98
           C 345 98, 409 151, 409 235
           C 409 320, 345 374, 257 374
           C 231 374, 210 369, 190 360
           L 126 405
           Z"
        fill="#040b29"
        stroke="url(#neon)"
        stroke-width="24"
        stroke-linejoin="round"
        filter="url(#brilho)"/>

  <!-- Acabamento interno do balão -->
  <path d="M 164 346
           C 123 320, 105 279, 105 235
           C 105 151, 170 98, 257 98
           C 345 98, 409 151, 409 235
           C 409 320, 345 374, 257 374
           C 231 374, 210 369, 190 360
           L 126 405"
        fill="none"
        stroke="url(#neon)"
        stroke-width="5"
        stroke-linecap="round"
        opacity=".95"/>

  <!-- Três pontos da conversa -->
  <g filter="url(#brilho)">
    <circle cx="197" cy="237" r="22"
            fill="url(#pontos)"/>
    <circle cx="257" cy="237" r="22"
            fill="url(#pontos)"/>
    <circle cx="317" cy="237" r="22"
            fill="url(#pontos)"/>
  </g>

  <!-- Reflexo sutil -->
  <path d="M 151 137
           C 177 113, 209 104, 242 105"
        fill="none" stroke="#ffffff"
        stroke-width="3" opacity=".35"
        stroke-linecap="round"/>

</svg>
