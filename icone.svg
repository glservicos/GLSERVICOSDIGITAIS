
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512">

  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="35%" stop-color="#0055FF"/>
      <stop offset="65%" stop-color="#7900FF"/>
      <stop offset="100%" stop-color="#FF00E5"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="50%" stop-color="#2878FF"/>
      <stop offset="100%" stop-color="#FF28EA"/>
    </linearGradient>

    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#070B35"/>
      <stop offset="100%" stop-color="#010108"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo escuro -->
  <rect width="512" height="512" rx="88" fill="url(#bg)"/>

  <!-- Moldura luminosa -->
  <rect x="30" y="30" width="452" height="452" rx="100"
        fill="none" stroke="url(#neon)"
        stroke-width="5" filter="url(#glow)"/>

  <!-- Balão de conversa -->
  <path d="M256 102
           C174 102 112 153 112 234
           C112 279 132 315 164 339
           L135 389
           Q130 402 145 396
           L207 364
           C223 370 240 373 258 373
           C340 373 400 320 400 238
           C400 157 339 102 256 102 Z"
        fill="none"
        stroke="url(#neon)"
        stroke-width="34"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Nome Talkbox -->
  <text x="256" y="263"
        font-family="Arial, Helvetica, sans-serif"
        font-size="49"
        font-weight="bold"
        text-anchor="middle"
        textLength="220"
        lengthAdjust="spacingAndGlyphs"
        fill="url(#textGradient)"
        filter="url(#glow)">Talkbox</text>

</svg>
