<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512">

  <title>Talkbox</title>

  <defs>
    <radialGradient id="fundo" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#071344"/>
      <stop offset="65%" stop-color="#03091f"/>
      <stop offset="100%" stop-color="#01030c"/>
    </radialGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="42%" stop-color="#087bff"/>
      <stop offset="72%" stop-color="#a000ff"/>
      <stop offset="100%" stop-color="#ff35e8"/>
    </linearGradient>

    <linearGradient id="letras" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9bffff"/>
      <stop offset="42%" stop-color="#00bfff"/>
      <stop offset="72%" stop-color="#c35cff"/>
      <stop offset="100%" stop-color="#ff7aef"/>
    </linearGradient>

    <filter id="brilho" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="brilhoSuave" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <!-- Fundo escuro -->
  <rect x="18" y="18" width="476" height="476"
        rx="104" fill="url(#fundo)"/>

  <!-- Borda neon -->
  <rect x="28" y="28" width="456" height="456"
        rx="94" fill="none"
        stroke="url(#neon)" stroke-width="9"
        opacity="0.8" filter="url(#brilho)"/>

  <rect x="28" y="28" width="456" height="456"
        rx="94" fill="none"
        stroke="url(#neon)" stroke-width="4"/>

  <!-- Balão de conversa -->
  <path id="balao"
        d="M256 130
           C164 130 105 186 105 259
           C105 302 125 338 158 359
           L137 407
           Q132 421 148 415
           L207 383
           C223 389 240 392 260 392
           C350 392 408 337 408 261
           C408 186 348 130 256 130 Z"
        fill="none" stroke="url(#neon)"
        stroke-width="39" stroke-linecap="round"
        stroke-linejoin="round" opacity="0.45"
        filter="url(#brilhoSuave)"/>

  <use href="#balao"
       stroke="url(#neon)" stroke-width="34"
       fill="none" stroke-linecap="round"
       stroke-linejoin="round" filter="url(#brilho)"/>

  <use href="#balao"
       stroke="url(#neon)" stroke-width="25"
       fill="none" stroke-linecap="round"
       stroke-linejoin="round"/>

  <!-- Nome do aplicativo -->
  <text x="256" y="278"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="65"
        font-weight="800"
        letter-spacing="-3"
        fill="url(#letras)"
        stroke="#ffffff"
        stroke-opacity="0.22"
        stroke-width="1.2"
        paint-order="stroke fill"
        filter="url(#brilho)">Talkbox</text>

</svg>
