<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABP - Conversas</title>
  <!-- Ícones do Lucide/FontAwesome para estilo moderno -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #121b22; /* Modos escuro estilo WhatsApp */
      color: #e9edef;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Container Principal do App */
    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background-color: #111b21;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    /* Cabeçalho Topo */
    .header {
      background-color: #202c33;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #aebac1;
    }

    .header h1 {
      font-size: 20px;
      color: #e9edef;
      font-weight: 600;
    }

    .header-icons i {
      font-size: 18px;
      margin-left: 20px;
      cursor: pointer;
    }

    /* Lista de Conversas */
    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #222d34;
      transition: background 0.2s;
    }

    .chat-item:hover {
      background-color: #202c33;
    }

    /* Avatar do Usuário */
    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: #6b7c85;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      color: #fff;
      font-weight: bold;
      margin-right: 15px;
      flex-shrink: 0;
    }

    /* Detalhes da Conversa */
    .chat-info {
      flex: 1;
      overflow: hidden;
    }

    .chat-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .chat-name {
      font-size: 16px;
      font-weight: 500;
      color: #e9edef;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-time {
      font-size: 12px;
      color: #8696a0;
    }

    .chat-message {
      font-size: 14px;
      color: #8696a0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Botão Flutuante (+) */
    .fab-btn {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      background-color: #00a884;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #111b21;
      font-size: 24px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
      border: none;
      transition: transform 0.2s, background 0.2s;
    }

    .fab-btn:hover {
      background-color: #008f6f;
      transform: scale(1.05);
    }

    /* Modal / Popup de Novo Contato */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background-color: #222e35;
      width: 85%;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    .modal h3 {
      margin-bottom: 15px;
      color: #e9edef;
      font-size: 18px;
    }

    .modal input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #3b4a54;
      background-color: #111b21;
      color: #e9edef;
      font-size: 15px;
      outline: none;
      margin-bottom: 20px;
    }

    .modal input:focus {
      border-color: #00a884;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-cancel {
      background-color: transparent;
      color: #8696a0;
    }

    .btn-add {
      background-color: #00a884;
      color: #111b21;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Cabeçalho -->
    <header class="header">
      <h1>ABP</h1>
      <div class="header-icons">
        <i class="fa-solid fa-camera"></i>
        <i class="fa-solid fa-magnifying-glass"></i>
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </div>
    </header>

    <!-- Lista de Contatos/Conversas -->
    <div class="chat-list" id="chatList">
      <!-- Conversa Padrão Exemplo: Juliana -->
      <div class="chat-item">
        <div class="avatar" style="background-color: #e91e63;">J</div>
        <div class="chat-info">
          <div class="chat-top">
            <span class="chat-name">Juliana</span>
            <span class="chat-time">08:05</span>
          </div>
          <div class="chat-message">Oi! Tudo bem?</div>
        </div>
      </div>
    </div>

    <!-- Botão Flutuante (+) -->
    <button class="fab-btn" id="openModalBtn">
      <i class="fa-solid fa-plus"></i>
    </button>

    <!-- Modal para Adicionar Novo Contato -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <h3>Novo Contato</h3>
        <input type="text" id="contactNameInput" placeholder="Digite o nome da pessoa..." />
        <div class="modal-buttons">
          <button class="btn btn-cancel" id="closeModalBtn">Cancelar</button>
          <button class="btn btn-add" id="addContactBtn">Adicionar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Elementos DOM
    const chatList = document.getElementById('chatList');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const addContactBtn = document.getElementById('addContactBtn');
    const contactNameInput = document.getElementById('contactNameInput');

    // Lista inicial de contatos fictícios
    const contacts = [
      { id: 1, name: "Juliana", message: "Oi! Tudo bem?", time: "08:05", color: "#e91e63" },
      { id: 2, name: "Carlos Oliveira", message: "Você viu o projeto?", time: "Ontem", color: "#2196f3" },
      { id: 3, name: "Grupo da Família", message: "Bom dia a todos!", time: "Ontem", color: "#4caf50" }
    ];

    // Função para gerar uma cor aleatória para os avatares
    function getRandomColor() {
      const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#009688', '#4caf50', '#ff9800'];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    // Função para renderizar a lista de conversas
    function renderChats() {
      chatList.innerHTML = '';
      contacts.forEach(contact => {
        const initialLetter = contact.name.charAt(0).toUpperCase();
        
        const chatItemHTML = `
          <div class="chat-item">
            <div class="avatar" style="background-color: ${contact.color};">${initialLetter}</div>
            <div class="chat-info">
              <div class="chat-top">
                <span class="chat-name">${contact.name}</span>
                <span class="chat-time">${contact.time}</span>
              </div>
              <div class="chat-message">${contact.message}</div>
            </div>
          </div>
        `;
        chatList.innerHTML += chatItemHTML;
      });
    }

    // Como verificar se a renderização funcionou:
    // A lista atualizará imediatamente ao carregar a página.

    // Abrir Modal
    openModalBtn.addEventListener('click', () => {
      modalOverlay.classList.add('active');
      contactNameInput.focus();
    });

    // Fechar Modal
    closeModalBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
      contactNameInput.value = '';
    });

    // Adicionar Novo Contato
    addContactBtn.addEventListener('click', () => {
      const name = contactNameInput.value.trim();
      if (name) {
        const now = new Date();
        const timeString = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        
        // Adiciona o novo contato no topo da lista
        contacts.unshift({
          id: Date.now(),
          name: name,
          message: "Nova conversa iniciada",
          time: timeString,
          color: getRandomColor()
        });

        renderChats();
        contactNameInput.value = '';
        modalOverlay.classList.remove('active');
      }
    });

    // Renderizar contatos ao iniciar
    renderChats();
  </script>
</body>
</html>
