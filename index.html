<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talkbox IPTV</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121214">

    <!-- Video.js CSS para o Player -->
    <link href="https://vjs.zencdn.net/8.5.2/video-js.css" rel="stylesheet" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: #202024;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #29292e;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: #8257e5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls-top {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"], select {
            background: #121214;
            border: 1px solid #29292e;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
        }

        input[type="text"]:focus {
            border-color: #8257e5;
        }

        button, label.btn {
            background: #8257e5;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
            display: inline-block;
        }

        button:hover, label.btn:hover {
            background: #996dff;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background: #121214;
            border-right: 1px solid #29292e;
            display: flex;
            flex-direction: column;
        }

        .nav-tabs {
            display: flex;
            background: #202024;
            border-bottom: 1px solid #29292e;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: #a8a8b3;
            border-radius: 0;
            font-size: 0.85rem;
        }

        .tab-btn.active {
            color: #fff;
            border-bottom: 2px solid #8257e5;
            background: #121214;
        }

        .search-box {
            padding: 10px;
            border-bottom: 1px solid #29292e;
        }

        .search-box input {
            width: 100%;
        }

        .content-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .media-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            background: #202024;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .media-item:hover {
            background: #29292e;
            transform: translateX(2px);
        }

        .media-item img {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
        }

        .media-info {
            overflow: hidden;
        }

        .media-title {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .media-category {
            font-size: 0.75rem;
            color: #a8a8b3;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
            position: relative;
        }

        .player-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-js {
            width: 100%;
            height: 100%;
        }

        .placeholder-text {
            color: #737380;
            text-align: center;
        }

        /* Modal para carregar M3U */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #202024;
            padding: 24px;
            border-radius: 8px;
            width: 90%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; height: 45%; }
            .content-area { height: 55%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            📺 Talkbox IPTV
        </div>
        <div class="controls-top">
            <button onclick="abrirModal()">+ Carregar Lista</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Barra Lateral: Lista de Canais / Filmes -->
        <div class="sidebar">
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="filtrarTipo('canal')">Canais</button>
                <button class="tab-btn" onclick="filtrarTipo('filme')">Filmes</button>
                <button class="tab-btn" onclick="filtrarTipo('serie')">Séries</button>
            </div>
            <div class="search-box">
                <input type="text" id="inputBusca" placeholder="Buscar no Talkbox..." oninput="filtrarGeral()">
            </div>
            <div class="content-list" id="listaConteudo">
                <div class="placeholder-text" style="margin-top: 20px;">Nenhuma lista carregada. Clique em "+ Carregar Lista".</div>
            </div>
        </div>

        <!-- Área Central: Player de Vídeo -->
        <div class="content-area">
            <div class="player-wrapper">
                <div id="noVideo" class="placeholder-text">
                    <h2>Nenhum vídeo selecionado</h2>
                    <p>Escolha um canal ou filme na lista para começar a assistir.</p>
                </div>
                <video id="iptvPlayer" class="video-js vjs-big-play-centered hidden" controls preload="auto"></video>
            </div>
        </div>
    </div>

    <!-- Modal para entrada da Lista M3U -->
    <div id="modalLista" class="modal hidden">
        <div class="modal-content">
            <h3>Carregar Lista IPTV</h3>
            <p style="font-size: 0.85rem; color: #a8a8b3;">Cole o link .m3u / .m3u8 ou envie o arquivo do seu dispositivo:</p>

            <input type="text" id="urlM3U" placeholder="https://exemplo.com/lista.m3u">
            <button onclick="carregarPorURL()">Baixar Lista via URL</button>

            <hr style="border-color: #29292e;">

            <label class="btn" style="text-align: center;">
                Escolher Arquivo .m3u
                <input type="file" id="fileM3U" accept=".m3u,.m3u8" style="display: none;" onchange="carregarPorArquivo(event)">
            </label>

            <button style="background: #29292e;" onclick="fecharModal()">Cancelar</button>
        </div>
    </div>

    <!-- Scripts do Video.js -->
    <script src="https://vjs.zencdn.net/8.5.2/video.min.js"></script>

    <script>
        let todosOsItens = [];
        let tipoAtual = 'canal';
        let player = null;

        // Inicializa o player de vídeo
        document.addEventListener('DOMContentLoaded', () => {
            player = videojs('iptvPlayer');
            
            // Carrega lista salva se existir no navegador
            const listaSalva = localStorage.getItem('talkbox_iptv_data');
            if (listaSalva) {
                todosOsItens = JSON.parse(listaSalva);
                renderizarLista();
            } else {
                abrirModal();
            }
        });

        function abrirModal() { document.getElementById('modalLista').classList.remove('hidden'); }
        function fecharModal() { document.getElementById('modalLista').classList.add('hidden'); }

        // Faz a leitura e interpretação do texto .m3u
        function processarM3U(texto) {
            const linhas = texto.split('\n');
            const itens = [];
            let itemAtual = {};

            linhas.forEach(linha => {
                linha = linha.trim();
                if (linha.startsWith('#EXTINF:')) {
                    itemAtual = {};
                    
                    // Extrai o Nome
                    const partes = linha.split(',');
                    itemAtual.nome = partes[partes.length - 1].trim();

                    // Extrai a Capa/Logo
                    const logoMatch = linha.match(/tvg-logo="([^"]*)"/);
                    itemAtual.logo = logoMatch ? logoMatch[1] : 'https://via.placeholder.com/150/202024/ffffff?text=IPTV';

                    // Extrai o Grupo/Categoria
                    const grupoMatch = linha.match(/group-title="([^"]*)"/);
                    itemAtual.grupo = grupoMatch ? grupoMatch[1] : 'Geral';

                } else if (linha && !linha.startsWith('#')) {
                    itemAtual.url = linha;
                    
                    const g = (itemAtual.grupo || '').toLowerCase();
                    if (g.includes('filme') || g.includes('vod') || linha.endsWith('.mp4') || linha.endsWith('.mkv')) {
                        itemAtual.tipo = 'filme';
                    } else if (g.includes('serie') || g.includes('série')) {
                        itemAtual.tipo = 'serie';
                    } else {
                        itemAtual.tipo = 'canal';
                    }

                    if (itemAtual.nome && itemAtual.url) {
                        itens.push(itemAtual);
                    }
                }
            });

            todosOsItens = itens;
            localStorage.setItem('talkbox_iptv_data', JSON.stringify(itens));
            renderizarLista();
            fecharModal();
        }

        function carregarPorURL() {
            const url = document.getElementById('urlM3U').value;
            if (!url) return alert('Por favor, informe uma URL válida!');
            
            fetch(url)
                .then(res => res.text())
                .then(texto => processarM3U(texto))
                .catch(err => alert('Erro ao carregar lista. Verifique o link ou problemas de CORS.'));
        }

        function carregarPorArquivo(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                processarM3U(e.target.result);
            };
            reader.readAsText(file);
        }

        function filtrarTipo(tipo) {
            tipoAtual = tipo;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderizarLista();
        }

        function filtrarGeral() {
            renderizarLista();
        }

        function renderizarLista() {
            const container = document.getElementById('listaConteudo');
            const termoBusca = document.getElementById('inputBusca').value.toLowerCase();
            container.innerHTML = '';

            const filtrados = todosOsItens.filter(item => {
                const bateuTipo = item.tipo === tipoAtual;
                const bateuBusca = item.nome.toLowerCase().includes(termoBusca) || item.grupo.toLowerCase().includes(termoBusca);
                return bateuTipo && bateuBusca;
            });

            if (filtrados.length === 0) {
                container.innerHTML = '<div class="placeholder-text" style="margin-top:20px;">Nenhum item encontrado.</div>';
                return;
            }

            filtrados.forEach(item => {
                const el = document.createElement('div');
                el.className = 'media-item';
                el.onclick = () => reproduzir(item);
                el.innerHTML = `
                    <img src="${item.logo}" onerror="this.src='https://via.placeholder.com/150/202024/ffffff?text=IPTV'">
                    <div class="media-info">
                        <div class="media-title">${item.nome}</div>
                        <div class="media-category">${item.grupo}</div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function reproduzir(item) {
            document.getElementById('noVideo').classList.add('hidden');
            const playerEl = document.getElementById('iptvPlayer');
            playerEl.classList.remove('hidden');

            let tipoMidia = 'application/x-mpegURL'; // Padrão HLS (.m3u8)
            if (item.url.endsWith('.mp4')) tipoMidia = 'video/mp4';
            if (item.url.endsWith('.mkv')) tipoMidia = 'video/x-matroska';

            player.src({
                src: item.url,
                type: tipoMidia
            });

            player.play();
        }
    </script>
</body>
</html>
