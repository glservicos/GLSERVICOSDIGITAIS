<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talkbox IPTV</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#120822">

    <link href="https://vjs.zencdn.net/8.5.2/video-js.css" rel="stylesheet">
    <link href="https://unpkg.com/@silvermine/videojs-quality-selector/dist/silvermine-videojs-quality-selector.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0d041a, #1e0938 50%, #0d041a);
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .screen-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, #290b4d, #0a0314 90%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
            overflow-y: auto;
        }

        .login-container {
            display: flex;
            width: 100%;
            max-width: 850px;
            background: rgba(22, 10, 40, .9);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(168, 85, 247, .3);
            box-shadow: 0 20px 40px #000c;
            overflow: hidden;
        }

        .login-brand-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            border-right: 1px solid #ffffff14;
            position: relative;
        }

        .back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: transparent;
            border: none;
            color: #bfa9d6;
            font-size: .85rem;
            cursor: pointer;
            font-weight: 600;
        }

        .back-btn:hover {
            color: #fff;
        }

        .logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
        }

        .tv-logo-icon {
            font-size: 3.5rem;
        }

        .logo-text-main {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(90deg, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text-sub {
            font-size: .8rem;
            color: #bfa9d6;
            letter-spacing: 2px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .login-form-side {
            flex: 1.2;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 14px;
        }

        .login-form-side h3 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .input-ip-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-ip-group input {
            background: rgba(10, 3, 20, .9);
            border: 1px solid #ffffff26;
            color: #fff;
            padding: 11px 14px;
            border-radius: 8px;
            outline: none;
            font-size: .9rem;
            width: 100%;
        }

        .input-ip-group input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 8px #a855f780;
        }

        .btn-add-user {
            background: linear-gradient(90deg, #7c3aed, #a855f7);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: .9rem;
            box-shadow: 0 4px 12px #7c3aed66;
            width: 100%;
        }

        .btn-add-user:hover {
            filter: brightness(1.12);
        }

        .login-bottom-links {
            display: flex;
            justify-content: flex-start;
            font-size: .78rem;
            color: #bfa9d6;
        }

        .login-bottom-links span {
            cursor: pointer;
        }

        .login-bottom-links span:hover {
            color: #38bdf8;
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        /* PAINEL ADMIN */
        .admin-box {
            background: rgba(22, 10, 40, .97);
            padding: 25px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #a855f766;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .admin-section {
            background: rgba(10, 3, 20, .8);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #a855f733;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* CABEÇALHO */
        header {
            background: linear-gradient(90deg, #1e0938, #2e0f54);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 2px solid #a855f74d;
            z-index: 10;
        }

        .logo-header {
            font-size: 1.2rem;
            font-weight: 900;
        }

        .logo-header span {
            color: #38bdf8;
        }

        .top-nav {
            display: flex;
            gap: 6px;
        }

        .nav-tab {
            background: #ffffff0f;
            border: 1px solid #ffffff1a;
            color: #fff;
            font-size: .8rem;
            font-weight: 700;
            padding: 6px 14px;
            cursor: pointer;
            border-radius: 16px;
        }

        .nav-tab.active {
            background: linear-gradient(90deg, #38bdf8, #a855f7);
            border-color: transparent;
        }

        .main-container {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .sidebar {
            width: 350px;
            flex-shrink: 0;
            background: rgba(14, 5, 28, .97);
            border-right: 1px solid #a855f733;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .list-header {
            padding: 12px;
            font-size: .8rem;
            font-weight: 800;
            color: #38bdf8;
            text-transform: uppercase;
            background: #19082d99;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .quality-filter {
            display: flex;
            gap: 4px;
            padding: 6px 10px;
            background: #0a031480;
            justify-content: center;
            flex-wrap: wrap;
        }

        .q-btn {
            background: #ffffff14;
            border: none;
            color: #d8b4fe;
            font-size: .7rem;
            font-weight: 700;
            padding: 5px 8px;
            border-radius: 8px;
            cursor: pointer;
        }

        .q-btn.active {
            background: #a855f7;
            color: #fff;
        }

        .search-box {
            padding: 8px 10px;
        }

        .search-box input {
            width: 100%;
            padding: 8px;
            font-size: .8rem;
            background: #080210cc;
            border: 1px solid #a855f766;
            border-radius: 6px;
            color: #fff;
            outline: none;
        }

        .content-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .media-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background: #ffffff08;
            border: 1px solid #a855f726;
            border-radius: 8px;
            cursor: pointer;
        }

        .media-item:hover {
            background: #a855f71f;
        }

        .media-item img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 6px;
            background: #000;
            flex-shrink: 0;
        }

        .media-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .media-title {
            font-size: .85rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .badge-res {
            font-size: .55rem;
            background: #38bdf8;
            color: #000;
            padding: 1px 4px;
            border-radius: 4px;
            font-weight: 900;
            flex-shrink: 0;
        }

        .media-category {
            font-size: .68rem;
            color: #bfa9d6;
        }

        .btn-fav {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            color: #5b21b6;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-fav.active {
            color: #facc15;
        }

        /* PLAYER */
        .content-area {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        .player-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: #1e0938;
        }

        #playerTitle {
            overflow-wrap: anywhere;
        }

        .player-wrapper {
            flex: 1;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }

        .video-js {
            width: 100%;
            height: 100%;
        }

        .placeholder-text {
            color: #bfa9d6;
            text-align: center;
            padding: 15px;
        }

        .placeholder-text h2 {
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                max-width: 400px;
            }

            .login-brand-side {
                border-right: none;
                border-bottom: 1px solid #ffffff14;
                padding: 24px 20px;
            }

            .login-form-side {
                padding: 20px;
            }

            .main-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: 45%;
                flex: 0 0 45%;
            }

            .content-area {
                height: 55%;
                flex: 1;
            }

            .top-nav {
                display: none;
            }

            header {
                padding: 10px 12px;
            }
        }

        @media (max-height: 600px) {
            .screen-overlay {
                align-items: flex-start;
            }

            .login-brand-side {
                padding: 15px;
            }

            .logo-box {
                gap: 4px;
            }

            .tv-logo-icon {
                font-size: 2rem;
            }

            .logo-text-main {
                font-size: 1.5rem;
            }

            .login-form-side {
                gap: 9px;
                padding: 18px;
            }

            .input-ip-group input {
                padding: 9px 12px;
            }
        }
    </style>
</head>

<body>

    <!-- LOGIN -->
    <div id="screenLogin" class="screen-overlay">
        <div class="login-container">

            <div class="login-brand-side">
                <button class="back-btn" onclick="abrirTelaAdmin()">
                    ⚙️ Admin
                </button>

                <div class="logo-box">
                    <div class="tv-logo-icon">📺</div>
                    <div class="logo-text-main">Talkbox</div>
                    <div class="logo-text-sub">IPTV Player</div>
                </div>
            </div>

            <div class="login-form-side">
                <h3>Enter Your Login Details</h3>

                <div class="input-ip-group">
                    <input type="text" id="loginName"
                           placeholder="Name (Opcional)">
                </div>

                <div class="input-ip-group">
                    <input type="text" id="loginUser"
                           placeholder="Username"
                           autocomplete="username">
                </div>

                <div class="input-ip-group">
                    <input type="password" id="loginPass"
                           placeholder="Password"
                           autocomplete="current-password">
                </div>

                <div class="input-ip-group">
                    <input type="url" id="loginUrl"
                           placeholder="URL Address (Cole sua lista M3U)">
                </div>

                <button class="btn-add-user" onclick="realizarLoginCliente()">
                    Entrar
                </button>

                <div class="login-bottom-links">
                    <span onclick="abrirTelaAdmin()">Painel Admin</span>
                </div>
            </div>
        </div>
    </div>

    <!-- PAINEL ADMIN -->
    <div id="screenAdmin" class="screen-overlay hidden">
        <div class="admin-box">

            <h2 style="color:#38bdf8;text-align:center;font-size:1.2rem;">
                Painel Administrativo
            </h2>

            <div id="adminLoginBox"
                 style="display:flex;flex-direction:column;gap:10px;">

                <div class="input-ip-group">
                    <input type="text" id="adminUserInput"
                           placeholder="Usuário Admin">
                </div>

                <div class="input-ip-group">
                    <input type="password" id="adminPassInput"
                           placeholder="Senha Admin">
                </div>

                <button class="btn-add-user" onclick="validarAdmin()">
                    Entrar
                </button>

                <button class="btn-add-user"
                        style="background:#32154c;box-shadow:none;"
                        onclick="voltarLoginCliente()">
                    Voltar
                </button>
            </div>

            <div id="adminDashboardBox" class="hidden"
                 style="display:flex;flex-direction:column;gap:10px;">

                <div class="admin-section">
                    <label style="color:#38bdf8;font-weight:700;font-size:.78rem;">
                        URL M3U Global
                    </label>

                    <input type="url" id="adminM3uUrl"
                           placeholder="https://..."
                           style="padding:8px;background:#000;border:1px solid #7c3aed;color:#fff;border-radius:6px;font-size:.8rem;">

                    <button class="btn-add-user"
                            style="padding:8px;font-size:.8rem;"
                            onclick="salvarEProcessarM3U()">
                        Salvar e Sincronizar
                    </button>
                </div>

                <button class="btn-add-user"
                        style="background:#32154c;box-shadow:none;"
                        onclick="fecharAdmin()">
                    Fechar
                </button>
            </div>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <header>
        <div class="logo-header">Talkbox <span>IPTV</span></div>

        <div class="top-nav">
            <button class="nav-tab active"
                    onclick="filtrarTipo('canal',event)">Canais</button>
            <button class="nav-tab"
                    onclick="filtrarTipo('filme',event)">Filmes</button>
            <button class="nav-tab"
                    onclick="filtrarTipo('serie',event)">Séries</button>
            <button class="nav-tab"
                    onclick="filtrarTipo('favorito',event)">⭐ Favoritos</button>
        </div>

        <button class="btn-add-user"
                style="width:auto;padding:5px 12px;font-size:.75rem;box-shadow:none;"
                onclick="fazerLogout()">Sair</button>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <div class="list-header">
                <span id="tituloSecao">Canais de TV</span>
                <span id="contadorItens">0 itens</span>
            </div>

            <div class="quality-filter">
                <button class="q-btn active"
                        onclick="filtrarResolucoes('TODAS',event)">TODAS</button>
                <button class="q-btn"
                        onclick="filtrarResolucoes('4K',event)">4K</button>
                <button class="q-btn"
                        onclick="filtrarResolucoes('FHD',event)">FHD</button>
                <button class="q-btn"
                        onclick="filtrarResolucoes('HD',event)">HD</button>
                <button class="q-btn"
                        onclick="filtrarResolucoes('SD',event)">SD</button>
            </div>

            <div class="search-box">
                <input type="search" id="inputBusca"
                       placeholder="Pesquisar..."
                       oninput="filtrarGeral()">
            </div>

            <div class="content-list" id="listaConteudo"></div>
        </div>

        <div class="content-area">
            <div id="playerHeader" class="player-toolbar hidden">
                <span id="playerTitle">Selecione um canal</span>

                <button class="btn-add-user"
                        style="width:auto;padding:5px 10px;font-size:.7rem;box-shadow:none;"
                        onclick="expandirTelaCheia()">📺 Tela Cheia</button>
            </div>

            <div class="player-wrapper">
                <div id="noVideo" class="placeholder-text">
                    <h2>Selecione um item na lista</h2>
                    <p style="margin-top:8px;font-size:.85rem;">
                        Escolha um canal para começar.
                    </p>
                </div>

                <video id="iptvPlayer"
                       class="video-js vjs-big-play-centered hidden"
                       controls preload="auto" playsinline></video>
            </div>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.5.2/video.min.js"></script>
    <script src="https://unpkg.com/@silvermine/videojs-quality-selector/dist/silvermine-videojs-quality-selector.min.js"></script>

    <script>
        let todosOsItens = [];
        let favoritos = [];

        try {
            favoritos = JSON.parse(
                localStorage.getItem('talkbox_favs') || '[]'
            );

            if (!Array.isArray(favoritos)) favoritos = [];
        } catch (e) {
            favoritos = [];
        }

        let tipoAtual = 'canal';
        let resolucaoFiltro = 'TODAS';
        let player = null;
        let temporizadorReproducao = null;
        let tentativaAtual = 0;

        const LISTA_PADRAO =
            'https://iptv-org.github.io/iptv/countries/br.m3u';

        document.addEventListener('DOMContentLoaded', function () {
            player = videojs('iptvPlayer', {
                fluid: false,
                responsive: true,
                liveui: true,
                html5: {
                    vhs: {
                        overrideNative: true
                    }
                }
            });

            try {
                if (player.controlBar) {
                    player.controlBar.addChild('QualitySelector');
                }
            } catch (e) {
                console.warn('Seletor de qualidade indisponível:', e);
            }

            if (!localStorage.getItem('talkbox_admin_creds')) {
                localStorage.setItem(
                    'talkbox_admin_creds',
                    JSON.stringify({
                        user: 'admin',
                        pass: 'admin123'
                    })
                );
            }

            const listaSalva = localStorage.getItem('talkbox_m3u_text');

            if (listaSalva) {
                processarM3U(listaSalva);
            } else {
                baixarLista(LISTA_PADRAO, false);
            }

            if (localStorage.getItem('talkbox_session')) {
                document.getElementById('screenLogin')
                    .classList.add('hidden');
            } else {
                document.getElementById('screenLogin')
                    .classList.remove('hidden');
            }
        });

        /* CARREGAR LISTA */
        async function baixarLista(url, mostrarErro = true) {
            try {
                const resposta = await fetch(url);

                if (!resposta.ok) {
                    throw new Error('HTTP ' + resposta.status);
                }

                const texto = await resposta.text();

                if (!texto.includes('#EXTM3U') &&
                    !texto.includes('#EXTINF:')) {
                    throw new Error('A resposta não contém uma lista M3U válida.');
                }

                processarM3U(texto);

                localStorage.setItem('talkbox_m3u_text', texto);
                localStorage.setItem('talkbox_m3u_url', url);

                return true;
            } catch (erro) {
                console.error('Erro ao carregar M3U:', erro);

                if (mostrarErro) {
                    alert(
                        'Não foi possível carregar a lista M3U.\n\n' +
                        'Verifique o endereço, sua conexão e as permissões CORS do servidor.'
                    );
                }

                return false;
            }
        }

        async function salvarEProcessarM3U() {
            const url = document.getElementById('adminM3uUrl')
                .value.trim();

            if (!/^https?:\/\//i.test(url)) {
                alert('Informe uma URL válida iniciada por http:// ou https://.');
                return;
            }

            const ok = await baixarLista(url);

            if (ok) {
                alert('Lista carregada com sucesso.');
            }
        }

        /* PROCESSAR M3U */
        function processarM3U(texto) {
            const linhas = texto.split(/\r?\n/);
            const itens = [];
            let itemAtual = null;

            linhas.forEach(linha => {
                linha = linha.trim();

                if (linha.startsWith('#EXTINF:')) {
                    itemAtual = {};

                    const partes = linha.split(',');
                    itemAtual.nome =
                        partes[partes.length - 1].trim();

                    const logo = linha.match(/tvg-logo="([^"]*)"/i);
                    const grupo = linha.match(/group-title="([^"]*)"/i);

                    itemAtual.logo = logo
                        ? logo[1]
                        : 'https://via.placeholder.com/150/7c3aed/ffffff?text=TV';

                    itemAtual.grupo = grupo ? grupo[1] : 'Geral';

                    const nome = itemAtual.nome.toUpperCase();

                    if (/\b4K\b|UHD/.test(nome)) {
                        itemAtual.res = '4K';
                    } else if (/FHD|1080/.test(nome)) {
                        itemAtual.res = 'FHD';
                    } else if (/\bHD\b|720/.test(nome)) {
                        itemAtual.res = 'HD';
                    } else {
                        itemAtual.res = 'SD';
                    }
                } else if (linha && !linha.startsWith('#')) {
                    if (itemAtual) {
                        itemAtual.url = linha;

                        const grupo = itemAtual.grupo.toLowerCase();
                        const url = linha.toLowerCase().split('?')[0];

                        if (
                            grupo.includes('serie') ||
                            grupo.includes('série') ||
                            url.includes('/series/')
                        ) {
                            itemAtual.tipo = 'serie';
                        } else if (
                            grupo.includes('filme') ||
                            grupo.includes('vod') ||
                            url.includes('/movie/') ||
                            /\.(mp4|mkv|avi|mov|webm)$/.test(url)
                        ) {
                            itemAtual.tipo = 'filme';
                        } else {
                            itemAtual.tipo = 'canal';
                        }

                        if (itemAtual.nome && itemAtual.url) {
                            itens.push(itemAtual);
                        }

                        itemAtual = null;
                    }
                }
            });

            todosOsItens = itens;
            renderizarLista();
        }

        /* REPRODUÇÃO E DIAGNÓSTICO */
        function reproduzir(item) {
            if (!player || !item || !item.url) {
                alert('Endereço do canal inválido.');
                return;
            }

            tentativaAtual++;

            const minhaTentativa = tentativaAtual;

            if (temporizadorReproducao) {
                clearTimeout(temporizadorReproducao);
                temporizadorReproducao = null;
            }

            document.getElementById('noVideo').classList.add('hidden');
            document.getElementById('playerHeader').classList.remove('hidden');
            document.getElementById('playerTitle').textContent =
                'Carregando: ' + item.nome;

            const playerEl = document.getElementById('iptvPlayer');
            playerEl.classList.remove('hidden');

            const urlSemParametros = item.url
                .split('?')[0]
                .toLowerCase();

            let tipo = '';

            if (urlSemParametros.endsWith('.m3u8')) {
                tipo = 'application/x-mpegURL';
            } else if (urlSemParametros.endsWith('.mpd')) {
                tipo = 'application/dash+xml';
            } else if (urlSemParametros.endsWith('.mp4')) {
                tipo = 'video/mp4';
            } else if (urlSemParametros.endsWith('.webm')) {
                tipo = 'video/webm';
            } else if (urlSemParametros.endsWith('.mkv')) {
                tipo = 'video/x-matroska';
            }

            player.off('playing');
            player.off('error');
            player.off('waiting');
            player.off('stalled');

            function limparTemporizador() {
                if (temporizadorReproducao) {
                    clearTimeout(temporizadorReproducao);
                    temporizadorReproducao = null;
                }
            }

            player.on('playing', function aoReproduzir() {
                if (minhaTentativa !== tentativaAtual) return;

                limparTemporizador();

                document.getElementById('playerTitle').textContent =
                    item.nome;
            });

            player.on('error', function aoFalhar() {
                if (minhaTentativa !== tentativaAtual) return;

                limparTemporizador();

                const erro = player.error();
                let mensagem = 'Erro desconhecido.';

                if (erro) {
                    switch (erro.code) {
                        case 1:
                            mensagem = 'A reprodução foi interrompida.';
                            break;
                        case 2:
                            mensagem = 'Erro de rede ao carregar a transmissão.';
                            break;
                        case 3:
                            mensagem = 'Erro ao decodificar o vídeo.';
                            break;
                        case 4:
                            mensagem =
                                'Formato incompatível ou endereço indisponível.';
                            break;
                        default:
                            mensagem = erro.message || mensagem;
                    }
                }

                document.getElementById('playerTitle').textContent =
                    'Falha: ' + item.nome;

                console.error('Erro Video.js:', {
                    canal: item.nome,
                    url: item.url,
                    erro: erro
                });

                alert(
                    mensagem + '\n\n' +
                    'Teste outro canal. Se todos falharem, ' +
                    'verifique o acesso à transmissão e o formato.'
                );
            });

            player.on('waiting', function () {
                if (minhaTentativa !== tentativaAtual) return;

                document.getElementById('playerTitle').textContent =
                    'Aguardando transmissão: ' + item.nome;
            });

            player.on('stalled', function () {
                if (minhaTentativa !== tentativaAtual) return;

                console.warn('Transmissão temporariamente parada:', item.url);
            });

            player.src({
                src: item.url,
                ...(tipo ? { type: tipo } : {})
            });

            player.load();

            const resultado = player.play();

            if (resultado && typeof resultado.catch === 'function') {
                resultado.catch(function (erro) {
                    console.warn('Play não iniciou:', erro);

                    if (minhaTentativa === tentativaAtual) {
                        document.getElementById('playerTitle').textContent =
                            'Aguardando reprodução: ' + item.nome;
                    }
                });
            }

            temporizadorReproducao = setTimeout(function () {
                if (minhaTentativa !== tentativaAtual) return;

                if (!player.hasStarted() && !player.error()) {
                    document.getElementById('playerTitle').textContent =
                        'Transmissão demorando: ' + item.nome;

                    console.warn(
                        'O vídeo não começou em 15 segundos.',
                        item.url
                    );

                    alert(
                        'O canal não começou a reproduzir em 15 segundos.\n\n' +
                        'Possíveis causas:\n' +
                        '- Transmissão fora do ar;\n' +
                        '- Servidor bloqueando o navegador;\n' +
                        '- Formato de vídeo incompatível;\n' +
                        '- Conexão lenta ou endereço incorreto.\n\n' +
                        'Teste outro canal para comparar.'
                    );
                }

                temporizadorReproducao = null;
            }, 15000);
        }

        function expandirTelaCheia() {
            if (player) {
                player.requestFullscreen();
            }
        }

        /* LOGIN */
        function abrirTelaAdmin() {
            document.getElementById('screenLogin').classList.add('hidden');
            document.getElementById('screenAdmin').classList.remove('hidden');
        }

        function voltarLoginCliente() {
            document.getElementById('screenAdmin').classList.add('hidden');
            document.getElementById('screenLogin').classList.remove('hidden');
        }

        async function realizarLoginCliente() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const url = document.getElementById('loginUrl').value.trim();

            if (!user || !pass || !url) {
                alert('Preencha usuário, senha e URL da lista M3U.');
                return;
            }

            if (!/^https?:\/\//i.test(url)) {
                alert('Informe uma URL válida iniciada por http:// ou https://.');
                return;
            }

            const ok = await baixarLista(url);

            if (!ok) return;

            localStorage.setItem('talkbox_session', user);

            document.getElementById('screenLogin').classList.add('hidden');
        }

        /* ADMINISTRAÇÃO */
        function validarAdmin() {
            const user = document.getElementById('adminUserInput')
                .value.trim();

            const pass = document.getElementById('adminPassInput')
                .value.trim();

            let creds;

            try {
                creds = JSON.parse(
                    localStorage.getItem('talkbox_admin_creds') || 'null'
                );
            } catch (e) {
                creds = null;
            }

            if (creds && user === creds.user && pass === creds.pass) {
                document.getElementById('adminLoginBox')
                    .classList.add('hidden');

                document.getElementById('adminDashboardBox')
                    .classList.remove('hidden');

                document.getElementById('adminM3uUrl').value =
                    localStorage.getItem('talkbox_m3u_url') || '';
            } else {
                alert('Usuário ou senha incorretos!');
            }
        }

        function fecharAdmin() {
            document.getElementById('screenAdmin').classList.add('hidden');

            document.getElementById('adminLoginBox')
                .classList.remove('hidden');

            document.getElementById('adminDashboardBox')
                .classList.add('hidden');

            if (!localStorage.getItem('talkbox_session')) {
                document.getElementById('screenLogin')
                    .classList.remove('hidden');
            }
        }

        function fazerLogout() {
            localStorage.removeItem('talkbox_session');
            location.reload();
        }

        /* FAVORITOS */
        function toggleFavorito(item, event) {
            event.stopPropagation();

            const index = favoritos.findIndex(f => f.url === item.url);

            if (index >= 0) {
                favoritos.splice(index, 1);
            } else {
                favoritos.push(item);
            }

            localStorage.setItem(
                'talkbox_favs',
                JSON.stringify(favoritos)
            );

            renderizarLista();
        }

        function eFavorito(item) {
            return favoritos.some(f => f.url === item.url);
        }

        /* FILTROS */
        function filtrarTipo(tipo, evt) {
            tipoAtual = tipo;

            document.querySelectorAll('.nav-tab').forEach(btn => {
                btn.classList.remove('active');
            });

            if (evt) {
                evt.currentTarget.classList.add('active');
            }

            const titulos = {
                canal: 'Canais de TV',
                filme: 'Filmes VOD',
                serie: 'Séries',
                favorito: 'Meus Favoritos'
            };

            document.getElementById('tituloSecao').textContent =
                titulos[tipo] || 'Conteúdos';

            renderizarLista();
        }

        function filtrarResolucoes(res, evt) {
            resolucaoFiltro = res;

            document.querySelectorAll('.q-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            if (evt) {
                evt.currentTarget.classList.add('active');
            }

            renderizarLista();
        }

        function filtrarGeral() {
            renderizarLista();
        }

        /* RENDERIZAÇÃO DA LISTA */
        function renderizarLista() {
            const container = document.getElementById('listaConteudo');
            const busca = document.getElementById('inputBusca')
                .value.toLowerCase();

            container.replaceChildren();

            const base = tipoAtual === 'favorito'
                ? favoritos
                : todosOsItens;

            const filtrados = base.filter(item => {
                const tipoOK =
                    tipoAtual === 'favorito' || item.tipo === tipoAtual;

                const buscaOK =
                    (item.nome || '').toLowerCase().includes(busca) ||
                    (item.grupo || '').toLowerCase().includes(busca);

                const resolucaoOK =
                    resolucaoFiltro === 'TODAS' ||
                    item.res === resolucaoFiltro;

                return tipoOK && buscaOK && resolucaoOK;
            });

            document.getElementById('contadorItens').textContent =
                filtrados.length + ' itens';

            if (!filtrados.length) {
                const aviso = document.createElement('div');

                aviso.className = 'placeholder-text';
                aviso.textContent =
                    'Nenhum item encontrado. Verifique a lista M3U ou os filtros.';

                container.appendChild(aviso);
                return;
            }

            filtrados.forEach(item => {
                const el = document.createElement('div');
                el.className = 'media-item';

                el.addEventListener('click', function () {
                    reproduzir(item);
                });

                const img = document.createElement('img');

                img.src = item.logo ||
                    'https://via.placeholder.com/150/7c3aed/ffffff?text=TV';

                img.alt = item.nome || 'Canal';
                img.loading = 'lazy';

                img.addEventListener('error', function () {
                    img.src =
                        'https://via.placeholder.com/150/7c3aed/ffffff?text=TV';
                }, { once: true });

                const info = document.createElement('div');
                info.className = 'media-info';

                const titulo = document.createElement('div');
                titulo.className = 'media-title';
                titulo.textContent = item.nome || 'Sem nome';

                const badge = document.createElement('span');
                badge.className = 'badge-res';
                badge.textContent = item.res || 'SD';

                titulo.appendChild(badge);

                const categoria = document.createElement('div');
                categoria.className = 'media-category';
                categoria.textContent = item.grupo || 'Geral';

                info.appendChild(titulo);
                info.appendChild(categoria);

                const favorito = document.createElement('button');

                favorito.className =
                    'btn-fav' + (eFavorito(item) ? ' active' : '');

                favorito.textContent = '★';

                favorito.setAttribute(
                    'aria-label',
                    eFavorito(item)
                        ? 'Remover dos favoritos'
                        : 'Adicionar aos favoritos'
                );

                favorito.addEventListener('click', function (event) {
                    toggleFavorito(item, event);
                });

                el.appendChild(img);
                el.appendChild(info);
                el.appendChild(favorito);

                container.appendChild(el);
            });
        }
    </script>
