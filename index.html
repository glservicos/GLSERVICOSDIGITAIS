<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talkbox IPTV</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#120822">

    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.5.2/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@silvermine/videojs-quality-selector/dist/silvermine-videojs-quality-selector.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0d041a 0%, #1e0938 50%, #0d041a 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- TELA DE LOGIN RESPONSIVA E SEM CORTES --- */
        .screen-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #290b4d 0%, #0a0314 90%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
            overflow-y: auto;
        }

        .login-container {
            display: flex;
            width: 100%;
            max-width: 850px;
            background: rgba(22, 10, 40, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        .login-brand-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: transparent;
            border: none;
            color: #bfa9d6;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
        }
        .back-btn:hover { color: #fff; }

        .logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
        }

        .tv-logo-icon { font-size: 3.5rem; }

        .logo-text-main {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(90deg, #38bdf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text-sub {
            font-size: 0.8rem;
            color: #bfa9d6;
            letter-spacing: 2px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .btn-list-users {
            margin-top: 20px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-list-users:hover { background: rgba(56, 189, 248, 0.3); }

        .login-form-side {
            flex: 1.2;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 14px;
        }

        .login-form-side h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }

        .input-ip-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-ip-group input {
            background: rgba(10, 3, 20, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 11px 14px;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
            width: 100%;
        }
        .input-ip-group input:focus { border-color: #a855f7; box-shadow: 0 0 8px rgba(168, 85, 247, 0.5); }

        .btn-add-user {
            background: linear-gradient(90deg, #7c3aed 0%, #a855f7 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
            width: 100%;
        }

        .login-bottom-links {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: #bfa9d6;
        }
        .login-bottom-links span { cursor: pointer; }
        .login-bottom-links span:hover { color: #38bdf8; text-decoration: underline; }

        /* Adaptação para Celulares (Empilha o Login perfeitamente sem cortes) */
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                max-width: 400px;
            }
            .login-brand-side { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08); padding: 20px; }
            .login-form-side { padding: 20px; }
        }

        /* --- RESTANTE DO APP --- */
        header {
            background: linear-gradient(90deg, #1e0938 0%, #2e0f54 100%);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid rgba(168, 85, 247, 0.3);
            z-index: 10;
        }
        .logo-header { font-size: 1.2rem; font-weight: 900; color: #fff; }
        .logo-header span { color: #38bdf8; }
        .top-nav { display: flex; gap: 6px; }
        .nav-tab {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 6px 14px;
            cursor: pointer;
            border-radius: 16px;
        }
        .nav-tab.active { background: linear-gradient(90deg, #38bdf8 0%, #a855f7 100%); border-color: transparent; }

        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 350px; background: rgba(14, 5, 28, 0.95); border-right: 1px solid rgba(168, 85, 247, 0.2); display: flex; flex-direction: column; }
        .list-header { padding: 12px; font-size: 0.8rem; font-weight: 800; color: #38bdf8; text-transform: uppercase; background: rgba(25, 8, 45, 0.6); display: flex; justify-content: space-between; }
        .quality-filter { display: flex; gap: 4px; padding: 6px 10px; background: rgba(10, 3, 20, 0.5); justify-content: center; }
        .q-btn { background: rgba(255,255,255,0.08); border: none; color: #d8b4fe; font-size: 0.7rem; font-weight: 700; padding: 3px 8px; border-radius: 8px; cursor: pointer; }
        .q-btn.active { background: #a855f7; color: #fff; }
        .search-box { padding: 8px 10px; }
        .search-box input { width: 100%; padding: 8px; font-size: 0.8rem; background: rgba(8, 2, 16, 0.8); border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 6px; color: #fff; outline: none; }
        .content-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
        .media-item { display: flex; align-items: center; gap: 10px; padding: 8px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(168, 85, 247, 0.15); border-radius: 8px; cursor: pointer; }
        .media-item img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; background: #000; }
        .media-info { flex: 1; overflow: hidden; }
        .media-title { font-size: 0.85rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
        .badge-res { font-size: 0.55rem; background: #38bdf8; color: #000; padding: 1px 4px; border-radius: 4px; font-weight: 900; }
        .media-category { font-size: 0.68rem; color: #bfa9d6; }
        .btn-fav { background: transparent; border: none; font-size: 1.2rem; color: #5b21b6; cursor: pointer; }
        .btn-fav.active { color: #facc15; }

        .content-area { flex: 1; display: flex; flex-direction: column; background: #000; }
        .player-toolbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; background: #1e0938; }
        .player-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; background: #000; }
        .video-js { width: 100%; height: 100%; }
        .placeholder-text { color: #bfa9d6; text-align: center; }
        .hidden { display: none !important; }

        .admin-box { background: rgba(22, 10, 40, 0.95); padding: 25px; border-radius: 16px; width: 90%; max-width: 400px; border: 1px solid rgba(168, 85, 247, 0.4); display: flex; flex-direction: column; gap: 12px; }
        .admin-section { background: rgba(10, 3, 20, 0.7); padding: 10px; border-radius: 8px; border: 1px solid rgba(168, 85, 247, 0.2); display: flex; flex-direction: column; gap: 6px; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; height: 45%; }
            .content-area { height: 55%; }
            .top-nav { display: none; } /* Oculta em telas muito pequenas se necessário, ou mantém compacto */
        }
    </style>
</head>
<body>

    <!-- 1. TELA DE LOGIN RESPONSIVA -->
    <div id="screenLogin" class="screen-overlay">
        <div class="login-container">
            <div class="login-brand-side">
                <button class="back-btn" onclick="abrirTelaAdmin()">⚙️ Admin</button>
                <div class="logo-box">
                    <div class="tv-logo-icon">📺</div>
                    <div class="logo-text-main">Talkbox</div>
                    <div class="logo-text-sub">IPTV Player</div>
                </div>
                <button class="btn-list-users" onclick="entrarModoDemonstracao()">⚡ Modo Demonstração</button>
            </div>

            <div class="login-form-side">
                <h3>Enter Your Login Details</h3>
                <div class="input-ip-group"><input type="text" id="loginName" placeholder="Name (Opcional)"></div>
                <div class="input-ip-group"><input type="text" id="loginUser" placeholder="Username"></div>
                <div class="input-ip-group"><input type="password" id="loginPass" placeholder="Password"></div>
                <div class="input-ip-group"><input type="text" id="loginUrl" placeholder="URL Address (Cole sua lista M3U)"></div>

                <button class="btn-add-user" onclick="realizarLoginCliente()">Add User</button>
                
                <div class="login-bottom-links">
                    <span onclick="abrirTelaAdmin()">Painel Admin</span>
                    <span onclick="entrarModoDemonstracao()">Entrar Direto</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. PAINEL ADMIN -->
    <div id="screenAdmin" class="screen-overlay hidden">
        <div class="admin-box">
            <h2 style="color:#38bdf8; text-align:center; font-size:1.2rem;">Painel Administrativo</h2>
            <div id="adminLoginBox" style="display:flex; flex-direction:column; gap:10px;">
                <div class="input-ip-group"><input type="text" id="adminUserInput" placeholder="Usuário Admin"></div>
                <div class="input-ip-group"><input type="password" id="adminPassInput" placeholder="Senha Admin"></div>
                <button class="btn-add-user" onclick="validarAdmin()">Entrar</button>
                <button class="btn-list-users" style="margin:0;" onclick="voltarLoginCliente()">Voltar</button>
            </div>
            <div id="adminDashboardBox" class="hidden" style="display:flex; flex-direction:column; gap:10px;">
                <div class="admin-section">
                    <label style="color:#38bdf8; font-weight:700; font-size:0.78rem;">URL M3U Global</label>
                    <input type="text" id="adminM3uUrl" placeholder="http://..." style="padding:8px; background:#000; border:1px solid #7c3aed; color:#fff; border-radius:6px; font-size:0.8rem;">
                    <button class="btn-add-user" style="padding:8px; font-size:0.8rem;" onclick="salvarEProcessarM3U()">Salvar e Sincronizar</button>
                </div>
                <button class="btn-list-users" style="margin:0;" onclick="fecharAdmin()">Fechar</button>
            </div>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <header>
        <div class="logo-header">Talkbox <span>IPTV</span></div>
        <div class="top-nav">
            <button class="nav-tab active" onclick="filtrarTipo('canal', event)">Canais</button>
            <button class="nav-tab" onclick="filtrarTipo('filme', event)">Filmes</button>
            <button class="nav-tab" onclick="filtrarTipo('serie', event)">Séries</button>
            <button class="nav-tab" onclick="filtrarTipo('favorito', event)">⭐ Favoritos</button>
        </div>
        <div>
            <button class="btn-list-users" style="padding: 4px 10px; font-size: 0.7rem; margin:0;" onclick="fazerLogout()">Sair</button>
        </div>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <div class="list-header">
                <span id="tituloSecao">Canais de TV</span>
                <span id="contadorItens" style="color:#38bdf8;">0 itens</span>
            </div>
            <div class="quality-filter">
                <button class="q-btn active" onclick="filtrarResolucoes('TODAS', event)">TODAS</button>
                <button class="q-btn" onclick="filtrarResolucoes('4K', event)">4K</button>
                <button class="q-btn" onclick="filtrarResolucoes('FHD', event)">FHD</button>
                <button class="q-btn" onclick="filtrarResolucoes('HD', event)">HD</button>
                <button class="q-btn" onclick="filtrarResolucoes('SD', event)">SD</button>
            </div>
            <div class="search-box">
                <input type="text" id="inputBusca" placeholder="Pesquisar..." oninput="filtrarGeral()">
            </div>
            <div class="content-list" id="listaConteudo"></div>
        </div>

        <div class="content-area">
            <div id="playerHeader" class="player-toolbar hidden">
                <span id="playerTitle" style="font-size: 0.85rem;">Reproduzindo...</span>
                <button class="btn-list-users" style="padding: 4px 8px; font-size: 0.7rem; margin:0;" onclick="expandirTelaCheia()">📺 Tela Cheia</button>
            </div>
            <div class="player-wrapper">
                <div id="noVideo" class="placeholder-text">
                    <h2>Selecione um item na lista</h2>
                </div>
                <video id="iptvPlayer" class="video-js vjs-big-play-centered hidden" controls preload="auto"></video>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://vjs.zencdn.net/8.5.2/video.min.js"></script>
    <script src="https://unpkg.com/@silvermine/videojs-quality-selector/dist/silvermine-videojs-quality-selector.min.js"></script>

    <script>
        let todosOsItens = [];
        let favoritos = JSON.parse(localStorage.getItem('talkbox_favs') || '[]');
        let tipoAtual = 'canal';
        let resolucaoFiltro = 'TODAS';
        let player = null;

        const LISTA_PADRAO = "https://iptv-org.github.io/iptv/countries/br.m3u";

        document.addEventListener('DOMContentLoaded', () => {
            player = videojs('iptvPlayer');
            if (player.controlBar && player.controlBar.addChild) {
                try { player.controlBar.addChild('QualitySelector'); } catch(e) {}
            }

            if (!localStorage.getItem('talkbox_admin_creds')) {
                localStorage.setItem('talkbox_admin_creds', JSON.stringify({ user: "admin", pass: "admin123" }));
            }

            const m3uSalva = localStorage.getItem('talkbox_m3u_text');
            if (m3uSalva) {
                processarM3U(m3uSalva);
            } else {
                baixarLista(LISTA_PADRAO);
            }

            const sessao = localStorage.getItem('talkbox_session');
            if (sessao) {
                document.getElementById('screenLogin').classList.add('hidden');
            }
        });

        function baixarLista(url) {
            fetch(url)
                .then(res => res.text())
                .then(texto => {
                    localStorage.setItem('talkbox_m3u_text', texto);
                    processarM3U(texto);
                }).catch(() => {});
        }

        function salvarEProcessarM3U() {
            const url = document.getElementById('adminM3uUrl').value.trim();
            if (!url) return alert('Insira a URL M3U!');
            baixarLista(url);
            alert('Lista sincronizada com sucesso!');
        }

        function processarM3U(texto) {
            const linhas = texto.split('\n');
            const itens = [];
            let itemAtual = null;

            linhas.forEach(linha => {
                linha = linha.trim();
                if (linha.startsWith('#EXTINF:')) {
                    itemAtual = {};
                    const partes = linha.split(',');
                    itemAtual.nome = partes[partes.length - 1].trim();

                    const logoMatch = linha.match(/tvg-logo="([^"]*)"/);
                    itemAtual.logo = logoMatch ? logoMatch[1] : 'https://via.placeholder.com/150/7c3aed/ffffff?text=TV';

                    const grupoMatch = linha.match(/group-title="([^"]*)"/);
                    itemAtual.grupo = grupoMatch ? grupoMatch[1] : 'Geral';

                    const n = itemAtual.nome.toUpperCase();
                    if (n.includes('4K') || n.includes('UHD')) itemAtual.res = '4K';
                    else if (n.includes('FHD') || n.includes('1080')) itemAtual.res = 'FHD';
                    else if (n.includes('HD') || n.includes('720')) itemAtual.res = 'HD';
                    else itemAtual.res = 'SD';
                } else if (linha && !linha.startsWith('#')) {
                    if (itemAtual) {
                        itemAtual.url = linha;
                        const g = (itemAtual.grupo || '').toLowerCase();
                        const urlLower = linha.toLowerCase();

                        if (g.includes('serie') || g.includes('série') || urlLower.includes('/series/')) {
                            itemAtual.tipo = 'serie';
                        } else if (g.includes('filme') || g.includes('vod') || urlLower.endsWith('.mp4') || urlLower.endsWith('.mkv') || urlLower.includes('/movie/')) {
                            itemAtual.tipo = 'filme';
                        } else {
                            itemAtual.tipo = 'canal';
                        }

                        if (itemAtual.nome && itemAtual.url) itens.push(itemAtual);
                        itemAtual = null;
                    }
                }
            });

            todosOsItens = itens;
            renderizarLista();
        }

        function toggleFavorito(item, event) {
            event.stopPropagation();
            const index = favoritos.findIndex(f => f.url === item.url);
            if (index >= 0) favoritos.splice(index, 1);
            else favoritos.push(item);
            localStorage.setItem('talkbox_favs', JSON.stringify(favoritos));
            renderizarLista();
        }

        function eFavorito(item) { return favoritos.some(f => f.url === item.url); }

        function reproduzir(item) {
            document.getElementById('noVideo').classList.add('hidden');
            document.getElementById('playerHeader').classList.remove('hidden');
            document.getElementById('playerTitle').innerText = `${item.nome} [${item.res}]`;

            const playerEl = document.getElementById('iptvPlayer');
            playerEl.classList.remove('hidden');

            let tipoMidia = 'application/x-mpegURL';
            if (item.url.endsWith('.mp4')) tipoMidia = 'video/mp4';
            if (item.url.endsWith('.mkv')) tipoMidia = 'video/x-matroska';

            player.src({ src: item.url, type: tipoMidia });
            player.play();
        }

        function expandirTelaCheia() { if (player.requestFullscreen) player.requestFullscreen(); }

        function abrirTelaAdmin() {
            document.getElementById('screenLogin').classList.add('hidden');
            document.getElementById('screenAdmin').classList.remove('hidden');
        }
        function voltarLoginCliente() {
            document.getElementById('screenAdmin').classList.add('hidden');
            document.getElementById('screenLogin').classList.remove('hidden');
        }
        function validarAdmin() {
            const user = document.getElementById('adminUserInput').value.trim();
            const pass = document.getElementById('adminPassInput').value.trim();
            const creds = JSON.parse(localStorage.getItem('talkbox_admin_creds'));
            if (user === creds.user && pass === creds.pass) {
                document.getElementById('adminLoginBox').classList.add('hidden');
                document.getElementById('adminDashboardBox').classList.remove('hidden');
                document.getElementById('adminM3uUrl').value = localStorage.getItem('talkbox_m3u_url') || '';
            } else alert('Senha incorreta!');
        }
        function fecharAdmin() {
            document.getElementById('screenAdmin').classList.add('hidden');
            if (!localStorage.getItem('talkbox_session')) document.getElementById('screenLogin').classList.remove('hidden');
        }

        function realizarLoginCliente() {
            const user = document.getElementById('loginUser').value.trim();
            const urlInput = document.getElementById('loginUrl').value.trim();

            if (urlInput) {
                baixarLista(urlInput);
                localStorage.setItem('talkbox_m3u_url', urlInput);
            }

            localStorage.setItem('talkbox_session', user || 'Usuário VIP');
            document.getElementById('screenLogin').classList.add('hidden');
        }

        function entrarModoDemonstracao() {
            localStorage.setItem('talkbox_session', 'Modo Demo');
            document.getElementById('screenLogin').classList.add('hidden');
        }

        function fazerLogout() {
            localStorage.removeItem('talkbox_session');
            location.reload();
        }

        function filtrarTipo(tipo, evt) {
            tipoAtual = tipo;
            document.querySelectorAll('.nav-tab').forEach(btn => btn.classList.remove('active'));
            if (evt) evt.target.classList.add('active');

            const titulos = { 'canal': 'Canais de TV', 'filme': 'Filmes VOD', 'serie': 'Séries', 'favorito': 'Meus Favoritos' };
            document.getElementById('tituloSecao').innerText = titulos[tipo] || 'Conteúdos';
            renderizarLista();
        }

        function filtrarResolucoes(res, evt) {
            resolucaoFiltro = res;
            document.querySelectorAll('.q-btn').forEach(btn => btn.classList.remove('active'));
            if (evt) evt.target.classList.add('active');
            renderizarLista();
        }

        function filtrarGeral() { renderizarLista(); }

        function renderizarLista() {
            const container = document.getElementById('listaConteudo');
            const termoBusca = document.getElementById('inputBusca').value.toLowerCase();
            container.innerHTML = '';

            let listaBase = tipoAtual === 'favorito' ? favoritos : todosOsItens;

            const filtrados = listaBase.filter(item => {
                const bateuTipo = (tipoAtual === 'favorito') || (item.tipo === tipoAtual);
                const bateuBusca = item.nome.toLowerCase().includes(termoBusca) || item.grupo.toLowerCase().includes(termoBusca);
                const bateuRes = (resolucaoFiltro === 'TODAS') || (item.res === resolucaoFiltro);
                return bateuTipo && bateuBusca && bateuRes;
            });

            document.getElementById('contadorItens').innerText = `${filtrados.length} itens`;

            if (filtrados.length === 0) {
                container.innerHTML = '<div class="placeholder-text" style="padding:20px; font-size:0.8rem;">Nenhum item encontrado. Insira uma URL M3U válida.</div>';
                return;
            }

            filtrados.forEach(item => {
                const fav = eFavorito(item);
                const el = document.createElement('div');
                el.className = 'media-item';
                el.onclick = () => reproduzir(item);
                el.innerHTML = `
                    <img src="${item.logo}" onerror="this.src='https://via.placeholder.com/150/7c3aed/ffffff?text=TV'">
                    <div class="media-info">
                        <div class="media-title">${item.nome} <span class="badge-res">${item.res}</span></div>
                        <div class="media-category">${item.grupo}</div>
                    </div>
                    <button class="btn-fav ${fav ? 'active' : ''}" onclick="toggleFavorito(${JSON.stringify(item).replace(/"/g, '&quot;')}, event)">★</button>
                `;
                container.appendChild(el);
            });
        }
    </script>
</body>
</html>
