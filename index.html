<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalkBox - Completo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #121b22; color: #e9edef; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

    .app-container {
      width: 100%; max-width: 420px; height: 100vh; background-color: #111b21;
      display: flex; flex-direction: column; position: relative; box-shadow: 0 0 10px rgba(0,0,0,0.5); overflow: hidden;
    }

    .screen {
      position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 60px);
      display: flex; flex-direction: column; background-color: #111b21;
      transform: translateX(100%); transition: transform 0.3s ease; pointer-events: none;
    }
    .screen.active { transform: translateX(0); pointer-events: auto; }

    /* CABEÇALHOS */
    .header {
      background-color: #111b21; padding: 16px;
      display: flex; justify-content: space-between; align-items: center; color: #e9edef;
    }
    .header h1 { font-size: 22px; font-weight: 700; color: #00a884; }
    .header-icons i { font-size: 20px; margin-left: 20px; cursor: pointer; color: #e9edef; }

    /* PESQUISA */
    .search-box-container { padding: 4px 16px 12px 16px; background-color: #111b21; }
    .search-box {
      background-color: #202c33; border-radius: 24px; padding: 10px 16px;
      display: flex; align-items: center; gap: 12px; color: #8696a0; font-size: 14px;
    }
    .search-box input { background: transparent; border: none; color: #e9edef; font-size: 14px; outline: none; width: 100%; }

    /* LISTAS GERAIS */
    .list-container { flex: 1; overflow-y: auto; }
    .list-item {
      display: flex; align-items: center; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #1f2c34;
      transition: background 0.2s;
    }
    .list-item:hover { background-color: #202c33; }
    
    .avatar {
      width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center;
      align-items: center; font-size: 20px; color: #fff; font-weight: bold; margin-right: 15px; flex-shrink: 0;
      position: relative;
    }
    .avatar.has-status { border: 3px solid #00a884; padding: 2px; }

    .list-info { flex: 1; overflow: hidden; }
    .list-top { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .list-name { font-size: 16px; font-weight: 500; color: #e9edef; }
    .list-time { font-size: 12px; color: #8696a0; }
    .list-message { font-size: 14px; color: #8696a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .fab-btn {
      position: absolute; bottom: 24px; right: 24px; width: 56px; height: 56px;
      background-color: #00a884; border-radius: 16px; display: flex; justify-content: center;
      align-items: center; color: #111b21; font-size: 22px; cursor: pointer; border: none; z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* BARRA INFERIOR */
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 60px;
      background-color: #111b21; display: flex; justify-content: space-around; align-items: center;
      border-top: 1px solid #222d34; z-index: 100;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #8696a0; font-size: 11px; cursor: pointer; flex: 1; height: 100%; gap: 4px;
    }
    .nav-item i { font-size: 18px; padding: 4px 16px; border-radius: 16px; }
    .nav-item.active { color: #e9edef; font-weight: 600; }
    .nav-item.active i { background-color: #003b31; color: #00a884; }

    /* TELA DE CHAT FULLSCREEN */
    .chat-screen-full {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #111b21; display: flex; flex-direction: column; transform: translateX(100%);
      transition: transform 0.3s ease; z-index: 500; pointer-events: none;
    }
    .chat-screen-full.active { transform: translateX(0); pointer-events: auto; }

    .chat-header { background-color: #202c33; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
    .back-btn { background: none; border: none; color: #aebac1; font-size: 18px; cursor: pointer; }
    .chat-body {
      flex: 1; background-color: #0b141a; background-image: radial-gradient(#1f2c34 1px, transparent 1px);
      background-size: 20px 20px; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
    }
    
    .message {
      max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px;
      line-height: 1.4; position: relative; word-wrap: break-word; color: #e9edef;
    }
    .message.received { background-color: #202c33; align-self: flex-start; border-top-left-radius: 0; }
    .message.sent { background-color: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
    .message img { width: 100%; max-width: 220px; border-radius: 6px; margin-bottom: 4px; display: block; }
    .message-reaction { position: absolute; bottom: -10px; right: 8px; background: #202c33; border-radius: 10px; padding: 2px 6px; font-size: 12px; cursor: pointer; }

    .chat-footer { background-color: #202c33; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
    .chat-footer input { flex: 1; background-color: #2a3942; border: none; border-radius: 8px; padding: 10px 14px; color: #e9edef; outline: none; }
    .chat-footer i { font-size: 20px; color: #8696a0; cursor: pointer; }
    .send-btn { background: none; border: none; color: #00a884; font-size: 20px; cursor: pointer; }

    /* OVERLAYS & MODAIS COMPLETOS */
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 2000; }
    .overlay.active { display: flex; }

    /* CÂMERA REAL COM SUPORTE FRENTE/TRÁS */
    .camera-modal { width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
    #cameraVideo { width: 100%; flex: 1; object-fit: cover; border-radius: 12px; margin: 10px 0; }
    .shutter-btn { width: 70px; height: 70px; border-radius: 50%; background: #fff; border: 4px solid #00a884; cursor: pointer; }

    /* TELA DE CHAMADA DE VOZ/VÍDEO */
    .call-modal { width: 100%; height: 100%; background: linear-gradient(135deg, #111b21, #0b141a); display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 60px 20px; text-align: center; }
    .call-avatar { width: 110px; height: 110px; border-radius: 50%; background-color: #00a884; color: #fff; font-size: 45px; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 25px rgba(0,168,132,0.5); }
    .hangup-btn { width: 75px; height: 75px; border-radius: 50%; background-color: #ea4335; color: #fff; border: none; font-size: 26px; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 12px rgba(234,67,53,0.5); }

    /* VISUALIZADOR DE STATUS */
    .status-viewer { width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: space-between; padding: 25px; }
    .status-progress { width: 100%; height: 3px; background: #444; border-radius: 2px; overflow: hidden; }
    .status-fill { width: 0%; height: 100%; background: #fff; transition: width 0.05s linear; }
    .status-body { flex: 1; display: flex; justify-content: center; align-items: center; text-align: center; color: #fff; font-size: 24px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- ABA 1: CONVERSAS -->
    <div class="screen active" id="tabConversas">
      <header class="header">
        <h1>TalkBox</h1>
        <div class="header-icons">
          <i class="fa-solid fa-camera" id="globalCameraBtn" title="Câmera"></i>
          <i class="fa-solid fa-ellipsis-vertical" id="menuBtn"></i>
        </div>
      </header>

      <div class="search-box-container">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Pesquisar conversas..." />
        </div>
      </div>

      <div class="list-container" id="chatList"></div>

      <button class="fab-btn" id="openModalBtn" title="Nova Conversa">
        <i class="fa-solid fa-comment-medical"></i>
      </button>
    </div>

    <!-- ABA 2: ATUALIZAÇÕES (STATUS) -->
    <div class="screen" id="tabAtualizacoes">
      <header class="header">
        <h1>Atualizações</h1>
        <div class="header-icons"><i class="fa-solid fa-camera" id="statusPostBtn" title="Postar Status"></i></div>
      </header>
      <div style="padding: 16px 16px 8px; color: #8696a0; font-size: 13px; font-weight: 600;">STATUS RECENTES</div>
      <div class="list-container" id="statusList"></div>
    </div>

    <!-- ABA 3: COMUNIDADES -->
    <div class="screen" id="tabComunidades">
      <header class="header"><h1>Comunidades</h1></header>
      <div style="padding: 40px; text-align: center; color: #8696a0;">
        <i class="fa-solid fa-users" style="font-size: 50px; color: #00a884; margin-bottom: 15px;"></i>
        <h2>Comunidades TalkBox</h2>
        <p style="margin-top: 10px;">Reúna grupos afins com segurança e controle total.</p>
      </div>
    </div>

    <!-- ABA 4: LIGAÇÕES -->
    <div class="screen" id="tabLigacoes">
      <header class="header"><h1>Ligações</h1></header>
      <div class="list-container" id="callsList"></div>
    </div>

    <!-- TELA DE CHAT FULLSCREEN -->
    <div class="chat-screen-full" id="chatScreen">
      <div class="chat-header">
        <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i></button>
        <div class="avatar" id="activeAvatar" style="width:40px; height:40px; font-size:16px;">J</div>
        <div style="flex:1;">
          <div id="activeName" style="font-weight: 500;">Juliana</div>
          <div style="font-size:11px; color:#00a884;">online</div>
        </div>
        <div class="header-icons" style="font-size: 16px;">
          <i class="fa-solid fa-video" id="chatVideoBtn" title="Vídeo Chamada" style="margin-left: 14px;"></i>
          <i class="fa-solid fa-phone" id="chatPhoneBtn" title="Ligação de Voz" style="margin-left: 14px;"></i>
          <i class="fa-solid fa-camera" id="chatCameraBtn" title="Enviar Foto" style="margin-left: 14px;"></i>
        </div>
      </div>

      <div class="chat-body" id="chatBody"></div>

      <div class="chat-footer">
        <i class="fa-regular fa-face-smile" title="Emojis"></i>
        <i class="fa-solid fa-paperclip" title="Anexo"></i>
        <input type="text" id="messageInput" placeholder="Mensagem" />
        <button class="send-btn" id="sendMessageBtn"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>

    <!-- BARRA INFERIOR -->
    <nav class="bottom-nav">
      <div class="nav-item active" data-tab="tabConversas"><i class="fa-solid fa-comment"></i><span>Conversas</span></div>
      <div class="nav-item" data-tab="tabAtualizacoes"><i class="fa-solid fa-circle-notch"></i><span>Atualizações</span></div>
      <div class="nav-item" data-tab="tabComunidades"><i class="fa-solid fa-users"></i><span>Comunidades</span></div>
      <div class="nav-item" data-tab="tabLigacoes"><i class="fa-solid fa-phone"></i><span>Ligações</span></div>
    </nav>

    <!-- OVERLAY CÂMERA -->
    <div class="overlay" id="cameraOverlay">
      <div class="camera-modal">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <button id="switchCameraBtn" style="background:none; border:none; color:#fff; font-size:22px; cursor:pointer;"><i class="fa-solid fa-rotate"></i></button>
          <button id="closeCameraBtn" style="background:none; border:none; color:#fff; font-size:24px; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <video id="cameraVideo" autoplay playsinline></video>
        <div style="display:flex; justify-content:center;">
          <button class="shutter-btn" id="takePhotoBtn" title="Capturar Foto"></button>
        </div>
      </div>
    </div>

    <!-- OVERLAY CHAMADA -->
    <div class="overlay" id="callOverlay">
      <div class="call-modal">
        <div class="call-info">
          <h2 id="callTitleName" style="font-size:24px; margin-bottom:6px;">Juliana</h2>
          <p id="callStatusText" style="color:#8696a0; font-size:14px;">Chamando...</p>
        </div>
        <div class="call-avatar" id="callAvatarIcon">J</div>
        <button class="hangup-btn" id="hangupBtn" title="Desligar"><i class="fa-solid fa-phone-slash"></i></button>
      </div>
    </div>

    <!-- OVERLAY STATUS VIEWER -->
    <div class="overlay" id="statusViewerOverlay">
      <div class="status-viewer">
        <div class="status-progress"><div class="status-fill" id="statusFill"></div></div>
        <div style="display:flex; justify-content:space-between; color:#fff; align-items:center;">
          <span id="statusAuthorName" style="font-weight:bold;">Juliana</span>
          <i class="fa-solid fa-xmark" id="closeStatusViewer" style="cursor:pointer; font-size:22px;"></i>
        </div>
        <div class="status-body" id="statusBodyText"></div>
        <div></div>
      </div>
    </div>

    <!-- MODAL NOVO CONTATO -->
    <div class="overlay" id="modalOverlay">
      <div style="background:#222e35; width:85%; padding:20px; border-radius:12px;">
        <h3 style="margin-bottom:15px; color:#e9edef;">Nova Conversa</h3>
        <input type="text" id="contactNameInput" placeholder="Nome do contato..." style="width:100%; padding:12px; border-radius:8px; border:1px solid #3b4a54; background:#111b21; color:#e9edef; outline:none; margin-bottom:20px;" />
        <div style="display:flex; justify-content:flex-end; gap:10px;">
          <button id="closeModalBtn" style="background:transparent; border:none; color:#8696a0; cursor:pointer; font-weight:600;">Cancelar</button>
          <button id="addContactBtn" style="background:#00a884; border:none; color:#111b21; padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:600;">Iniciar</button>
        </div>
      </div>
    </div>

  </div>

  <canvas id="snapshotCanvas" style="display:none;"></canvas>

  <script>
    let contacts = [
      { id: 1, name: "Juliana", color: "#e91e63", time: "08:05", hasStatus: true, statusText: "Aproveitando o dia ensolarado! ☀️", messages: [{ type: 'text', text: "Oi amor, tudo bem?", sender: "received", time: "08:05" }] },
      { id: 2, name: "Carlos Oliveira", color: "#2196f3", time: "Ontem", hasStatus: true, statusText: "Focado nos códigos 🚀", messages: [{ type: 'text', text: "Projeto atualizado.", sender: "received", time: "Ontem" }] }
    ];

    let callHistory = [
      { name: "Juliana", type: "video", direction: "incoming", time: "Ontem, 20:15" },
      { name: "Carlos Oliveira", type: "voice", direction: "outgoing", time: "Segunda-feira" }
    ];

    let currentContactId = null;
    let mediaStream = null;
    let useFrontCamera = true;

    // Navegação entre abas
    const screens = document.querySelectorAll('.screen');
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
      item.addEventListener('click', () => {
        const target = item.getAttribute('data-tab');
        navItems.forEach(n => n.classList.remove('active'));
        item.classList.add('active');
        screens.forEach(s => s.classList.remove('active'));
        document.getElementById(target).classList.add('active');
        document.getElementById('chatScreen').classList.remove('active');
        if(target === 'tabLigacoes') renderCalls();
        if(target === 'tabAtualizacoes') renderStatusList();
      });
    });

    // Renderizar Conversas
    function renderChats() {
      const chatList = document.getElementById('chatList');
      chatList.innerHTML = '';
      contacts.forEach(c => {
        const lastMsg = c.messages[c.messages.length - 1];
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div class="avatar ${c.hasStatus ? 'has-status' : ''}" style="background-color:${c.color};">${c.name.charAt(0)}</div>
          <div class="list-info">
            <div class="list-top"><span class="list-name">${c.name}</span><span class="list-time">${c.time}</span></div>
            <div class="list-message">${lastMsg ? (lastMsg.type === 'image' ? '📷 Foto' : lastMsg.text) : ''}</div>
          </div>
        `;
        item.addEventListener('click', () => openChat(c.id));
        chatList.appendChild(item);
      });
    }

    function openChat(id) {
      currentContactId = id;
      const c = contacts.find(item => item.id === id);
      document.getElementById('activeName').textContent = c.name;
      document.getElementById('activeAvatar').textContent = c.name.charAt(0);
      document.getElementById('activeAvatar').style.backgroundColor = c.color;
      renderMessages(c);
      document.getElementById('chatScreen').classList.add('active');
    }

    function renderMessages(contact) {
      const chatBody = document.getElementById('chatBody');
      chatBody.innerHTML = '';
      contact.messages.forEach((msg) => {
        const div = document.createElement('div');
        div.className = `message ${msg.sender}`;
        div.innerHTML = msg.type === 'image' ? `<img src="${msg.content}"/>` : msg.text;
        if(msg.reaction) {
          div.innerHTML += `<div class="message-reaction">${msg.reaction}</div>`;
        }
        div.addEventListener('click', () => {
          const emoji = prompt("Reagir com Emoji (👍, ❤️, 😂, 😮, 😢):", "❤️");
          if(emoji) { msg.reaction = emoji; renderMessages(contact); }
        });
        chatBody.appendChild(div);
      });
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    // Enviar Mensagem de Texto
    document.getElementById('sendMessageBtn').addEventListener('click', () => {
      const input = document.getElementById('messageInput');
      if(!input.value.trim() || !currentContactId) return;
      const c = contacts.find(item => item.id === currentContactId);
      c.messages.push({ type: 'text', text: input.value, sender: 'sent', time: 'Agora' });
      input.value = '';
      renderMessages(c);
      renderChats();
    });

    document.getElementById('messageInput').addEventListener('keypress', (e) => {
      if(e.key === 'Enter') document.getElementById('sendMessageBtn').click();
    });

    // Câmera Real (Frente / Trás com captura imediata)
    async function startCamera() {
      document.getElementById('cameraOverlay').classList.add('active');
      if(mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: useFrontCamera ? 'user' : 'environment' } });
        document.getElementById('cameraVideo').srcObject = mediaStream;
      } catch(e) { alert("Erro ao acessar a câmera."); }
    }

    document.getElementById('globalCameraBtn').addEventListener('click', startCamera);
    document.getElementById('chatCameraBtn').addEventListener('click', startCamera);
    document.getElementById('statusPostBtn').addEventListener('click', startCamera);

    document.getElementById('switchCameraBtn').addEventListener('click', () => {
      useFrontCamera = !useFrontCamera;
      startCamera();
    });

    document.getElementById('closeCameraBtn').addEventListener('click', () => {
      if(mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      document.getElementById('cameraOverlay').classList.remove('active');
    });

    document.getElementById('takePhotoBtn').addEventListener('click', () => {
      if(!mediaStream) return;
      const video = document.getElementById('cameraVideo');
      const canvas = document.getElementById('snapshotCanvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageUrl = canvas.toDataURL('image/png');

      if(currentContactId) {
        const c = contacts.find(item => item.id === currentContactId);
        c.messages.push({ type: 'image', content: imageUrl, sender: 'sent', time: 'Agora' });
        renderMessages(c);
      } else {
        // Se tirou pela aba Status, cria um status novo
        contacts[0].hasStatus = true;
        contacts[0].statusText = "Foto recente tirada na câmera!";
      }

      if(mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      document.getElementById('cameraOverlay').classList.remove('active');
      renderChats();
    });

    // Chamadas de Voz e Vídeo
    const callOverlay = document.getElementById('callOverlay');
    document.getElementById('chatPhoneBtn').addEventListener('click', () => triggerCall('voice'));
    document.getElementById('chatVideoBtn').addEventListener('click', () => triggerCall('video'));

    function triggerCall(type) {
      const c = contacts.find(item => item.id === currentContactId);
      document.getElementById('callTitleName').textContent = c.name;
      document.getElementById('callAvatarIcon').textContent = c.name.charAt(0);
      document.getElementById('callStatusText').textContent = type === 'video' ? 'Chamada de vídeo...' : 'Chamando...';
      callOverlay.classList.add('active');
      callHistory.unshift({ name: c.name, type: type, direction: 'outgoing', time: 'Agora' });
    }

    document.getElementById('hangupBtn').addEventListener('click', () => callOverlay.classList.remove('active'));

    // Status / Atualizações
    function renderStatusList() {
      const list = document.getElementById('statusList');
      list.innerHTML = '';
      contacts.filter(c => c.hasStatus).forEach(c => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div class="avatar has-status" style="background-color:${c.color};">${c.name.charAt(0)}</div>
          <div class="list-info">
            <div class="list-name">${c.name}</div>
            <div class="list-message">Hoje, às ${c.time}</div>
          </div>
        `;
        item.addEventListener('click', () => viewStatus(c));
        list.appendChild(item);
      });
    }

    function viewStatus(contact) {
      const overlay = document.getElementById('statusViewerOverlay');
      const fill = document.getElementById('statusFill');
      document.getElementById('statusAuthorName').textContent = contact.name;
      document.getElementById('statusBodyText').textContent = contact.statusText;
      overlay.classList.add('active');
      fill.style.width = '0%';
      setTimeout(() => fill.style.width = '100%', 50);
      setTimeout(() => overlay.classList.remove('active'), 4000);
    }

    document.getElementById('closeStatusViewer').addEventListener('click', () => {
      document.getElementById('statusViewerOverlay').classList.remove('active');
    });

    // Ligações Aba
    function renderCalls() {
      const list = document.getElementById('callsList');
      list.innerHTML = '';
      callHistory.forEach(call => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div class="avatar" style="background-color: #00a884;"><i class="fa-solid fa-${call.type === 'video' ? 'video' : 'phone'}"></i></div>
          <div class="list-info">
            <div class="list-name">${call.name}</div>
            <div class="list-message"><i class="fa-solid fa-arrow-${call.direction === 'outgoing' ? 'up text-success' : 'down'}"></i> ${call.time}</div>
          </div>
        `;
        list.appendChild(item);
      });
    }

    // Modal Novo Contato
    const modal = document.getElementById('modalOverlay');
    document.getElementById('openModalBtn').addEventListener('click', () => modal.classList.add('active'));
    document.getElementById('closeModalBtn').addEventListener('click', () => modal.classList.remove('active'));
    document.getElementById('addContactBtn').addEventListener('click', () => {
      const name = document.getElementById('contactNameInput').value.trim();
      if(name) {
        contacts.unshift({ id: Date.now(), name: name, color: '#009688', time: 'Agora', hasStatus: false, messages: [{ type: 'text', text: 'Conversa iniciada.', sender: 'received', time: 'Agora' }] });
        renderChats();
        modal.classList.remove('active');
        document.getElementById('contactNameInput').value = '';
      }
    });

    document.getElementById('backBtn').addEventListener('click', () => document.getElementById('chatScreen').classList.remove('active'));

    renderChats();
  </script>
</body>
</html>
