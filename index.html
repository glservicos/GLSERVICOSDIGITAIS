<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talkbox IPTV</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b0764">

    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.5.2/video-js.css" rel="stylesheet" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e0038 0%, #3b0764 40%, #1e1b4b 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- TELA DE LOGIN VÍVIDA E ILUMINADA --- */
        .screen-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 30%, #6b21a8 0%, #1e0038 80%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .card-box {
            background: rgba(30, 10, 60, 0.85);
            backdrop-filter: blur(20px);
            padding: 35px;
            border-radius: 24px;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 0 50px rgba(168, 85, 247, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 18px;
            border: 2px solid rgba(192, 132, 252, 0.4);
            max-height: 90vh;
            overflow-y: auto;
        }

        .card-box h2 {
            color: #ffffff;
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            text-shadow: 0 0 15px #c084fc;
        }
        .card-box h2 span {
            color: #38bdf8;
            text-shadow: 0 0 15px #38bdf8;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.9rem;
            color: #e9d5ff;
            font-weight: 600;
        }

        input[type="text"], input[type="password"] {
            background: rgba(15, 5, 30, 0.9);
            border: 2px solid #a855f7;
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            outline: none;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }

        button {
            background: linear-gradient(90deg, #a855f7 0%, #ec4899 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 20px rgba(236, 72, 153, 0.5);
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.8);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.12);
            color: #f3e8ff;
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
        }

        .link-admin {
            text-align: center;
            font-size: 0.9rem;
            color: #38bdf8;
            cursor: pointer;
            margin-top: 8px;
            font-weight: 700;
            text-decoration: underline;
        }

        /* --- CABEÇALHO VÍVIDO --- */
        header {
            background: linear-gradient(90deg, #2e1065 0%, #581c87 50%, #1e1b4b 100%);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #a855f7;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px #c084fc;
        }
        .logo span {
            color: #38bdf8;
        }

        .top-nav {
            display: flex;
            gap: 10px;
        }

        .nav-tab {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 800;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.2s;
        }

        .nav-tab.active {
            background: linear-gradient(90deg, #38bdf8 0%, #a855f7 100%);
            border-color: transparent;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }

        /* --- CONTAINER E SIDEBAR --- */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 380px;
            background: rgba(20, 5, 45, 0.95);
            border-right: 2px solid rgba(168, 85, 247, 0.3);
            display: flex;
            flex-direction: column;
        }

        .list-header {
            padding: 15px;
            font-size: 0.9rem;
            font-weight: 800;
            color: #38bdf8;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            background: rgba(40, 10, 80, 0.6);
        }

        .search-box {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            font-size: 0.9rem;
            background: rgba(10, 0, 25, 0.8);
            border: 1px solid #a855f7;
            border-radius: 10px;
            color: #fff;
        }

        .content-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .media-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .media-item:hover {
            background: rgba(168, 85, 247, 0.3);
            border-color: #38bdf8;
            transform: translateX(5px);
        }

        .media-item img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 10px;
            background: #000;
            border: 1px solid #c084fc;
        }

        .media-info {
            flex: 1;
            overflow: hidden;
        }

        .media-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .media-category {
            font-size: 0.75rem;
            color: #c084fc;
            margin-top: 3px;
        }

        .btn-fav {
            background: transparent;
            border: none;
            font-size: 1.4rem;
            color: #6b21a8;
            cursor: pointer;
        }
        .btn-fav.active { color: #facc15; }

        /* PLAYER AREA */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        .player-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #2e1065;
            border-bottom: 1px solid #a855f7;
        }

        .player-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #3b0764 0%, #000 100%);
        }

        .video-js { width: 100%; height: 100%; }

        .placeholder-text {
            color: #c084fc;
            text-align: center;
        }

        .hidden { display: none !important; }

        .admin-section {
            background: rgba(15, 5, 30, 0.9);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #a855f7;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- 1. TELA DE LOGIN VÍVIDA -->
    <div id="screenLogin" class="screen-overlay">
        <div class="card-box">
            <h2>Talkbox <span>IPTV</span></h2>
            <p style="font-size:0.9rem; color:#e9d5ff; text-align:center;">Acesse para assistir ao vivo</p>
            
            <div class="input-group">
                <label>Usuário</label>
                <input type="text" id="loginUser" placeholder="Seu usuário">
            </div>

            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="loginPass" placeholder="Sua senha">
            </div>

            <button onclick="realizarLoginCliente()">Entrar no Aplicativo</button>
            <button class="btn-secondary" onclick="entrarModoDemonstracao()">Modo Demonstração</button>
            <div class="link-admin" onclick="abrirTelaAdmin()">⚙️ Painel do Administrador</div>
        </div>
    </div>

    <!-- 2. PAINEL ADMIN -->
    <div id="screenAdmin" class="screen-overlay hidden">
        <div class="card-box" style="max-width: 500px;">
            <h2>Painel <span>Admin</span></h2>
            
            <div id="adminLoginBox" style="display: flex; flex-direction: column; gap: 12px;">
                <div class="input-group">
                    <label>Usuário Admin</label>
                    <input type="text" id="adminUserInput" placeholder="Usuário Admin">
                </div>
                <div class="input-group">
                    <label>Senha Admin</label>
                    <input type="password" id="adminPassInput" placeholder="Senha Admin">
                </div>
                <button onclick="validarAdmin()">Entrar no Painel</button>
                <button class="btn-secondary" onclick="voltarLoginCliente()">Voltar</button>
            </div>

            <div id="adminDashboardBox" class="hidden" style="display: flex; flex-direction: column; gap: 14px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 0.9rem; color: #38bdf8; font-weight: bold;">Configurar Lista</span>
                    <button class="btn-secondary" style="padding: 6px 12px;" onclick="fecharAdmin()">Sair</button>
                </div>

                <div class="admin-section">
                    <div class="input-group">
                        <label>URL M3U do Servidor:</label>
                        <input type="text" id="adminM3uUrl" placeholder="Cole sua lista M3U aqui">
                    </div>
                    <button style="background: #10b981;" onclick="salvarEProcessarM3U()">Salvar e Sincronizar Conteúdo</button>
                </div>

                <div class="admin-section">
                    <label style="color:#c084fc; font-weight:bold;">Gerar Clientes</label>
                    <div style="display: flex; gap: 10px;">
                        <button style="flex:1;" onclick="criarUsuario('teste')">+ Teste 2h</button>
                        <button style="flex:1;" onclick="criarUsuario('permanente')">+ VIP</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <header>
        <div class="logo">Talkbox <span>IPTV</span></div>
        <div class="top-nav">
            <button class="nav-tab active" onclick="filtrarTipo('canal', event)">Canais</button>
            <button class="nav-tab" onclick="filtrarTipo('filme', event)">Filmes</button>
            <button class="nav-tab" onclick="filtrarTipo('serie', event)">Séries</button>
            <button class="nav-tab" onclick="filtrarTipo('favorito', event)">⭐ Favoritos</button>
        </div>
        <div>
            <button class="btn-secondary" style="padding: 6px 14px; font-size: 0.8rem;" onclick="fazerLogout()">Sair</button>
        </div>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <div class="list-header">
                <span id="tituloSecao">Canais de TV</span>
                <span id="contadorItens" style="color:#38bdf8;">0 itens</span>
            </div>
            <div class="search-box">
                <input type="text" id="inputBusca" placeholder="Pesquisar..." oninput="filtrarGeral()">
            </div>
            <div class="content-list" id="listaConteudo"></div>
        </div>

        <div class="content-area">
            <div id="playerHeader" class="player-toolbar hidden">
                <span id="playerTitle">Reproduzindo...</span>
                <button class="btn-secondary" style="padding: 6px 12px;" onclick="expandirTelaCheia()">📺 Tela Cheia</button>
            </div>
            <div class="player-wrapper">
                <div id="noVideo" class="placeholder-text">
                    <h2>Selecione um canal ou filme</h2>
                </div>
                <video id="iptvPlayer" class="video-js vjs-big-play-centered hidden" controls preload="auto"></video>
            </div>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.5.2/video.min.js"></script>

    <script>
        let todosOsItens = [];
        let favoritos = JSON.parse(localStorage.getItem('talkbox_favs') || '[]');
        let tipoAtual = 'canal';
        let player = null;

        // LISTA PADRÃO CASO NÃO TENHA M3U SALVA
        const LISTA_PADRAO = "https://iptv-org.github.io/iptv/countries/br.m3u";

        document.addEventListener('DOMContentLoaded', () => {
            player = videojs('iptvPlayer');

            if (!localStorage.getItem('talkbox_admin_creds')) {
                localStorage.setItem('talkbox_admin_creds', JSON.stringify({ user: "admin", pass: "admin123" }));
            }

            if (!localStorage.getItem('talkbox_db_users')) {
                localStorage.setItem('talkbox_db_users', JSON.stringify([
                    { usuario: "teste1", senha: "123", tipo: "teste", expira: Date.now() + (2 * 60 * 60 * 1000) },
                    { usuario: "vip", senha: "456", tipo: "permanente", expira: null }
                ]));
            }

            const m3uSalva = localStorage.getItem('talkbox_m3u_text');
            if (m3uSalva) {
                processarM3U(m3uSalva);
            } else {
                // Se não tiver M3U salva, baixa a lista padrão automaticamente
                baixarLista(LISTA_PADRAO);
            }

            const sessao = localStorage.getItem('talkbox_session');
            if (sessao) {
                document.getElementById('screenLogin').classList.add('hidden');
            }
        });

        function baixarLista(url) {
            fetch(url)
                .then(res => res.text())
                .then(texto => {
                    localStorage.setItem('talkbox_m3u_text', texto);
                    processarM3U(texto);
                }).catch(() => {
                    carregarDemoManual();
                });
        }

        function salvarEProcessarM3U() {
            const url = document.getElementById('adminM3uUrl').value.trim();
            if (!url) return alert('Insira a URL M3U!');

            fetch(url)
                .then(res => res.text())
                .then(texto => {
                    localStorage.setItem('talkbox_m3u_url', url);
                    localStorage.setItem('talkbox_m3u_text', texto);
                    processarM3U(texto);
                    alert('Lista sincronizada com sucesso!');
                })
                .catch(err => alert('Erro ao carregar M3U.'));
        }

        function processarM3U(texto) {
            const linhas = texto.split('\n');
            const itens = [];
            let itemAtual = null;

            linhas.forEach(linha => {
                linha = linha.trim();
                if (linha.startsWith('#EXTINF:')) {
                    itemAtual = {};
                    const partes = linha.split(',');
                    itemAtual.nome = partes[partes.length - 1].trim();

                    const logoMatch = linha.match(/tvg-logo="([^"]*)"/);
                    itemAtual.logo = logoMatch ? logoMatch[1] : 'https://via.placeholder.com/150/6b21a8/ffffff?text=TV';

                    const grupoMatch = linha.match(/group-title="([^"]*)"/);
                    itemAtual.grupo = grupoMatch ? grupoMatch[1] : 'Geral';
                } else if (linha && !linha.startsWith('#')) {
                    if (itemAtual) {
                        itemAtual.url = linha;
                        const g = (itemAtual.grupo || '').toLowerCase();
                        const urlLower = linha.toLowerCase();

                        if (g.includes('serie') || g.includes('série') || urlLower.includes('/series/')) {
                            itemAtual.tipo = 'serie';
                        } else if (g.includes('filme') || g.includes('vod') || urlLower.endsWith('.mp4') || urlLower.endsWith('.mkv') || urlLower.includes('/movie/')) {
                            itemAtual.tipo = 'filme';
                        } else {
                            itemAtual.tipo = 'canal';
                        }

                        if (itemAtual.nome && itemAtual.url) {
                            itens.push(itemAtual);
                        }
                        itemAtual = null;
                    }
                }
            });

            todosOsItens = itens;
            renderizarLista();
        }

        function toggleFavorito(item, event) {
            event.stopPropagation();
            const index = favoritos.findIndex(f => f.url === item.url);
            if (index >= 0) favoritos.splice(index, 1);
            else favoritos.push(item);
            localStorage.setItem('talkbox_favs', JSON.stringify(favoritos));
            renderizarLista();
        }

        function eFavorito(item) { return favoritos.some(f => f.url === item.url); }

        function reproduzir(item) {
            document.getElementById('noVideo').classList.add('hidden');
            document.getElementById('playerHeader').classList.remove('hidden');
            document.getElementById('playerTitle').innerText = item.nome;

            const playerEl = document.getElementById('iptvPlayer');
            playerEl.classList.remove('hidden');

            let tipoMidia = 'application/x-mpegURL';
            if (item.url.endsWith('.mp4')) tipoMidia = 'video/mp4';
            if (item.url.endsWith('.mkv')) tipoMidia = 'video/x-matroska';

            player.src({ src: item.url, type: tipoMidia });
            player.play();
        }

        function expandirTelaCheia() {
            if (player.requestFullscreen) player.requestFullscreen();
        }

        function abrirTelaAdmin() {
            document.getElementById('screenLogin').classList.add('hidden');
            document.getElementById('screenAdmin').classList.remove('hidden');
            document.getElementById('adminLoginBox').classList.remove('hidden');
            document.getElementById('adminDashboardBox').classList.add('hidden');
        }

        function voltarLoginCliente() {
            document.getElementById('screenAdmin').classList.add('hidden');
            document.getElementById('screenLogin').classList.remove('hidden');
        }

        function validarAdmin() {
            const user = document.getElementById('adminUserInput').value.trim();
            const pass = document.getElementById('adminPassInput').value.trim();
            const creds = JSON.parse(localStorage.getItem('talkbox_admin_creds'));

            if (user === creds.user && pass === creds.pass) {
                document.getElementById('adminLoginBox').classList.add('hidden');
                document.getElementById('adminDashboardBox').classList.remove('hidden');
            } else alert('Senha incorreta!');
        }

        function fecharAdmin() {
            document.getElementById('screenAdmin').classList.add('hidden');
            if (!localStorage.getItem('talkbox_session')) document.getElementById('screenLogin').classList.remove('hidden');
        }

        function criarUsuario(tipo) {
            const usuarios = JSON.parse(localStorage.getItem('talkbox_db_users'));
            const randomID = Math.floor(1000 + Math.random() * 9000);
            const novoUser = `${tipo}_${randomID}`;
            const novaSenha = `${Math.floor(100 + Math.random() * 900)}`;

            usuarios.push({ usuario: novoUser, senha: novaSenha, tipo: tipo, expira: null });
            localStorage.setItem('talkbox_db_users', JSON.stringify(usuarios));
            alert(`Criado!\nUsuário: ${novoUser}\nSenha: ${novaSenha}`);
        }

        function realizarLoginCliente() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const usuarios = JSON.parse(localStorage.getItem('talkbox_db_users') || '[]');
            const encontrado = usuarios.find(u => u.usuario === user && u.senha === pass);

            if (!encontrado) return alert('Usuário ou senha inválidos!');
            localStorage.setItem('talkbox_session', user);
            document.getElementById('screenLogin').classList.add('hidden');
        }

        function entrarModoDemonstracao() {
            localStorage.setItem('talkbox_session', 'Modo Demo');
            document.getElementById('screenLogin').classList.add('hidden');
        }

        function fazerLogout() {
            localStorage.removeItem('talkbox_session');
            location.reload();
        }

        function filtrarTipo(tipo, evt) {
            tipoAtual = tipo;
            document.querySelectorAll('.nav-tab').forEach(btn => btn.classList.remove('active'));
            if (evt) evt.target.classList.add('active');

            const titulos = { 'canal': 'Canais de TV', 'filme': 'Filmes VOD', 'serie': 'Séries', 'favorito': 'Meus Favoritos' };
            document.getElementById('tituloSecao').innerText = titulos[tipo] || 'Conteúdos';
            renderizarLista();
        }

        function filtrarGeral() { renderizarLista(); }

        function renderizarLista() {
            const container = document.getElementById('listaConteudo');
            const termoBusca = document.getElementById('inputBusca').value.toLowerCase();
            container.innerHTML = '';

            let listaBase = tipoAtual === 'favorito' ? favoritos : todosOsItens;

            const filtrados = listaBase.filter(item => {
                const bateuTipo = (tipoAtual === 'favorito') || (item.tipo === tipoAtual);
                const bateuBusca = item.nome.toLowerCase().includes(termoBusca) || item.grupo.toLowerCase().includes(termoBusca);
                return bateuTipo && bateuBusca;
            });

            document.getElementById('contadorItens').innerText = `${filtrados.length} itens`;

            if (filtrados.length === 0) {
                container.innerHTML = '<div class="placeholder-text" style="padding:20px;">Nenhum item nesta aba. Cole a URL M3U do seu servidor no Painel Admin para carregar.</div>';
                return;
            }

            filtrados.forEach(item => {
                const fav = eFavorito(item);
                const el = document.createElement('div');
                el.className = 'media-item';
                el.onclick = () => reproduzir(item);
                el.innerHTML = `
                    <img src="${item.logo}" onerror="this.src='https://via.placeholder.com/150/6b21a8/ffffff?text=TV'">
                    <div class="media-info">
                        <div class="media-title">${item.nome}</div>
                        <div class="media-category">${item.grupo}</div>
                    </div>
                    <button class="btn-fav ${fav ? 'active' : ''}" onclick="toggleFavorito(${JSON.stringify(item).replace(/"/g, '&quot;')}, event)">★</button>
                `;
                container.appendChild(el);
            });
        }
    </script>
</body>
</html>
